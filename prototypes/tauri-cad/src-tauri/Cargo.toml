[package]
name = "gosurvey-spike"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", optional = true, features = [] }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[[bin]]
name = "GoSurveySpike"
path = "src/main.rs"
required-features = ["desktop"]
