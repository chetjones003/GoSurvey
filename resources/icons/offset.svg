<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C2C2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Offset: parallel lines with offset distance arrow -->
  <!-- Original line (bottom) -->
  <path d="M4 16 H19" />
  <circle cx="4" cy="16" r="1.2" fill="#2C2C2C" stroke="none"/>
  <circle cx="19" cy="16" r="1.2" fill="#2C2C2C" stroke="none"/>
  <!-- Offset line (top, dashed to indicate derived) -->
  <path d="M4 8 H19" stroke-dasharray="3 2.5" />
  <circle cx="4" cy="8" r="1.2" fill="white" stroke="#2C2C2C" stroke-width="1.4"/>
  <circle cx="19" cy="8" r="1.2" fill="white" stroke="#2C2C2C" stroke-width="1.4"/>
  <!-- Offset distance double-arrow -->
  <line x1="14" y1="8.8" x2="14" y2="15.2" stroke-width="1.4"/>
  <path d="M12.6 10.2 L14 8.2 L15.4 10.2" fill="none" stroke-width="1.4"/>
  <path d="M12.6 13.8 L14 15.8 L15.4 13.8" fill="none" stroke-width="1.4"/>
  <!-- Small perpendicular ticks at line ends -->
  <path d="M7 8 V16" stroke-width="1" opacity="0.35" stroke-dasharray="1.2 1.2"/>
</svg>
