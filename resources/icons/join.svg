<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C2C2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Join: two segments converging to a common node -->
  <!-- Left segment -->
  <path d="M4 16 L11 10" />
  <circle cx="4" cy="16" r="1.2" fill="#2C2C2C" stroke="none"/>
  <!-- Right segment -->
  <path d="M20 16 L13 10" />
  <circle cx="20" cy="16" r="1.2" fill="#2C2C2C" stroke="none"/>
  <!-- Join node -->
  <circle cx="12" cy="9.2" r="2.1" fill="white" stroke="#2C2C2C" stroke-width="1.7"/>
  <circle cx="12" cy="9.2" r="0.85" fill="#2C2C2C" stroke="none"/>
  <!-- Outgoing joined line -->
  <path d="M12 7.1 L12 4.2" />
  <circle cx="12" cy="4.2" r="1.2" fill="#2C2C2C" stroke="none"/>
  <!-- Small gap highlight at junction -->
  <path d="M10.8 11.2 L12 9.2 L13.2 11.2" opacity="0.25" stroke-width="1.1"/>
</svg>
