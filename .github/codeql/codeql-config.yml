# CodeQL configuration (REQ-324).
#
# Purpose: keep vendored third-party code out of CodeQL results. Large vendored libraries
# carry unreferenced helpers, FIXME markers, and dead code that are not this project's to
# fix; scanning them re-surfaces thousands of style/quality alerts every run and buries the
# small amount of first-party signal. See issue #347.
#
# This only scopes the analysis paths — query selection stays in the workflow
# (queries: security-and-quality).

name: "GoSurvey CodeQL config"

paths-ignore:
  - third_party
  - build
  - samples

# query-filters (2026-10-10, issue TBD): two global dataflow queries from the
# security-and-quality suite never finish on this codebase -- confirmed hung past 11+ hours
# locally and killed twice in CI (both runs stalled at the identical 181/183-query point).
# Both are taint-tracking configurations (cpp/overrun-write, cpp/invalid-pointer-deref);
# `paths-ignore` above only filters REPORTED alert locations, it does not stop the dataflow
# evaluator from tracing through third_party's extracted database (LibreDWG's huge
# pointer/array-heavy structs are the likely combinatorial-blowup source), so excluding
# third_party here does not fix this -- the query itself must be excluded.
query-filters:
  - exclude:
      id: cpp/overrun-write
  - exclude:
      id: cpp/invalid-pointer-deref
