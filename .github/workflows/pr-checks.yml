# PR gate (REQ-437). Full C++ build/tests and static analysis run in full-validation.yml;
# both workflows' check statuses are required and block merge. A validated docs-only PR skips CI;
# review requirements remain governed by branch rules.

name: pr-checks

on:
  pull_request:
    branches: [master, beta]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  classify-docs-only:
    name: policy / docs-only classification
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out classifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate docs-only label against changed paths
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/classify_docs_only.py

  fast-pr-gate:
    name: PR gate
    needs: classify-docs-only
    if: >-
      always() &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check patch formatting and Python syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # Vendored sources retain upstream formatting, including whitespace that `diff --check`
          # flags. Keep checking project-owned changes without rewriting third-party code.
          git diff --check "$BASE_SHA" HEAD -- . ':(exclude)third_party/**'
          python -m compileall -q .github/scripts
          python -m unittest discover -s .github/scripts -p "test_*.py"

  # These inexpensive security scans remain required on every non-docs PR.
  security-gitleaks:
    name: security / gitleaks
    needs: classify-docs-only
    if: >-
      always() &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-dependency-scan:
    name: security / dependency-scan
    needs: classify-docs-only
    if: >-
      always() &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.33.1
        env:
          # The default mirror.gcr.io source returned HTTP 404 twice in the 0.7.5 promotion scan.
          # Use Trivy's official GHCR database directly so the blocking scan can initialize.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          version: v0.75.0
