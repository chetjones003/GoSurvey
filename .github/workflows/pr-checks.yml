# PR gate (REQ-437). Full C++ build/tests and static analysis run in full-validation.yml;
# both workflows' check statuses are required and block merge. A validated docs-only PR skips CI;
# review requirements remain governed by branch rules.

name: pr-checks

on:
  pull_request:
    branches: [master, beta]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

# Label and edit events only matter when they change what CI checks: the docs-only and
# refactor proof labels, or a new base branch. Other label/edit events (status labels,
# title/body edits) get their own concurrency group so they never cancel a real run, and
# the `ci-event` job below skips every check. Keep this list in sync with `ci-event`.
concurrency:
  group: >-
    pr-checks-${{ github.event.pull_request.number }}${{ ((github.event.action == 'edited' && !github.event.changes.base) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["docs-only", "refactor: move-only", "refactor: split-only"]'), github.event.label.name))) && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

# Windows checks use the Victus PR pool. Fork PRs wait for maintainer approval.
defaults:
  run:
    shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"

jobs:
  # Decides whether this PR event can change a check result (see the concurrency comment).
  # When it cannot, every job below is skipped under a name that is never a required check,
  # so a skipped run never stands in for the required check of the same name.
  ci-event:
    name: policy / CI-relevant event
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
      # Skipped jobs show their name unevaluated, so the raw text must stay readable.
      name_suffix: ${{ steps.decide.outputs.relevant == 'false' && ' (ignored event)' || '' }}
    steps:
      - name: Decide whether this event changes CI results
        id: decide
        shell: bash
        env:
          IGNORED: >-
            ${{ (github.event.action == 'edited' && !github.event.changes.base) ||
              ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
               !contains(fromJSON('["docs-only", "refactor: move-only", "refactor: split-only"]'),
                         github.event.label.name)) }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          relevant=true
          if [ "$IGNORED" = "true" ]; then relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Event '$ACTION' (label '$LABEL'): CI relevant = $relevant"

  architecture-dependencies:
    name: architecture / dependency ratchet${{ needs.ci-event.outputs.name_suffix }}
    needs: [ci-event]
    if: >-
      !cancelled() && needs.ci-event.outputs.relevant != 'false'
    runs-on: [self-hosted, Windows, X64, gosurvey-pr-build]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Rename-aware debt comparison needs the PR base commit in this repository.
          fetch-depth: 0

      - name: Check out PR base for the ratchet reference
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref == 'master' && startsWith(github.head_ref, 'chore/release-') && 'beta' || github.event.pull_request.base.sha }}
          path: build/dependency-reference

      - name: Check dependency baseline
        run: python tools/architecture_dependencies.py --reference-root build/dependency-reference

      - name: Test dependency checker
        run: python -m unittest tools.test_architecture_dependencies tools.test_architecture_snapshot

      - name: Check system dependency diagrams are current
        run: python -m unittest tools.test_system_dependency_diagrams

  classify-docs-only:
    name: policy / docs-only classification${{ needs.ci-event.outputs.name_suffix }}
    needs: [ci-event]
    if: >-
      !cancelled() && needs.ci-event.outputs.relevant != 'false'
    runs-on: [self-hosted, Windows, X64, gosurvey-pr-build]
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out classifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate docs-only label against changed paths
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/classify_docs_only.py

  fast-pr-gate:
    name: PR gate${{ needs.ci-event.outputs.name_suffix }}
    needs: [ci-event, classify-docs-only]
    if: >-
      !cancelled() && needs.ci-event.outputs.relevant != 'false' &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: [self-hosted, Windows, X64, gosurvey-pr-build]
    steps:
      - name: Check out PR changes
        uses: actions/checkout@v4
        with:
          # Full history so the move-only proof can find the merge base with the PR base.
          fetch-depth: 0

      - name: Check patch formatting and Python syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$env:BASE_SHA"
          # Vendored sources retain upstream formatting, including whitespace that `diff --check`
          # flags. Keep checking project-owned changes without rewriting third-party code.
          git diff --check "$env:BASE_SHA" HEAD -- . ':(exclude)third_party/**'
          python -m compileall -q .github/scripts
          python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Prove move-only changes
        if: "${{ contains(github.event.pull_request.labels.*.name, 'refactor: move-only') }}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/check_move_only.py --base-ref "$env:BASE_SHA"

      - name: Check out base dependency reference
        if: "${{ contains(github.event.pull_request.labels.*.name, 'refactor: move-only') }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: build/dependency-reference
          persist-credentials: false

      - name: Check move-only dependency baseline
        if: "${{ contains(github.event.pull_request.labels.*.name, 'refactor: move-only') }}"
        run: python tools/architecture_dependencies.py --reference-root build/dependency-reference

      # ADR-0012 Track A (#1578). Moved lines only; the label must exist before it is applied.
      - name: Prove split-only changes
        if: "${{ contains(github.event.pull_request.labels.*.name, 'refactor: split-only') }}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/check_split_only.py --base-ref "$env:BASE_SHA"

  # File-size gate (#1213). Runs on every PR, including docs-only ones, so no docs-only skip here.
  # Advisory: the size step is continue-on-error, so its failure stays visible in the log but the job
  # (and the PR check) passes while legacy oversized files are split down.
  file-size-gate:
    name: PR gate / file size${{ needs.ci-event.outputs.name_suffix }}
    needs: [ci-event]
    if: >-
      !cancelled() && needs.ci-event.outputs.relevant != 'false'
    runs-on: [self-hosted, Windows, X64, gosurvey-pr-build]
    steps:
      - name: Check out PR changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce C/C++ source file-size limit
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$env:BASE_SHA"
          $allowGrowth = @()
          # Approved for PR #1553 only; keep the beta baseline unchanged for future PRs.
          if ($env:PR_NUMBER -eq '1553') {
            $allowGrowth = @('--allow-growth', 'src/qt/EditorWindow.cpp')
          }
          python .github/scripts/check_file_size.py --base-ref "$env:BASE_SHA" @allowGrowth

  # These inexpensive security scans remain required on every non-docs PR.
  security-gitleaks:
    name: security / gitleaks${{ needs.ci-event.outputs.name_suffix }}
    needs: [ci-event, classify-docs-only]
    if: >-
      !cancelled() && needs.ci-event.outputs.relevant != 'false' &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: [self-hosted, Windows, X64, gosurvey-pr-build]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $gitleaks = ./tools/ci-get-tool.ps1 -Name gitleaks
          & $gitleaks git --redact --verbose --no-banner "--log-opts=--no-merges --first-parent $env:BASE_SHA..$env:HEAD_SHA" .

  security-dependency-scan:
    name: security / dependency-scan${{ needs.ci-event.outputs.name_suffix }}
    needs: [ci-event, classify-docs-only]
    if: >-
      !cancelled() && needs.ci-event.outputs.relevant != 'false' &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: [self-hosted, Windows, X64, gosurvey-pr-build]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trivy filesystem scan
        run: |
          $trivy = ./tools/ci-get-tool.ps1 -Name trivy
          # The vulnerability database is cached on the runner, not in GitHub storage.
          $cache = Join-Path (Split-Path -Parent $env:RUNNER_TEMP) 'trivy-cache'
          & $trivy fs --cache-dir $cache --db-repository ghcr.io/aquasecurity/trivy-db:2 `
            --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .
