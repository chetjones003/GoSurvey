# CodeQL static analysis (REQ-324) — additive, security/quality-focused C++ scan.
#
# Deliberately separate from release.yml: this must never be able to slow down or block REQ-202's
# build/test/package/publish gate. A daily matrix scans both master and beta; workflow_dispatch
# runs the same scans on demand. It shares release.yml's MSVC/Ninja setup because CodeQL's C++
# analysis needs the project actually built with tracing, not merely configured.
#
# Findings land on the repository's Security tab (code scanning alerts) and fail the scan
# (REQ-402) when an error-severity result is found in the SARIF output — see the
# "Fail on error-severity findings" step below.

name: codeql

# REQ-402 (2026-10-09): CodeQL is whole-program analysis, so it is scheduled daily for both
# maintained branches instead of running on every PR. Findings remain visible in the Security tab;
# the severity check below fails a scheduled/manual run when error-level results are found.
on:
  schedule:
    - cron: '17 9 * * *' # Daily at 09:17 UTC; offset from the top of the hour to reduce queue delays.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.branch }})
    concurrency:
      group: codeql-${{ matrix.branch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        branch: [master, beta]
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
            Write-Host "Using $((Get-Command ninja).Source) ($(ninja --version))"
            exit 0
          }
          $ver = '1.12.1'
          $dir = Join-Path $env:RUNNER_TEMP 'ninja'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'ninja.zip'
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$ver/ninja-win.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:cpp-${{ matrix.branch }}'
          output: sarif-results

      - name: Fail on error-severity findings
        shell: pwsh
        run: |
          $sarifFiles = Get-ChildItem -Path sarif-results -Filter *.sarif -Recurse -ErrorAction SilentlyContinue
          if (-not $sarifFiles) { Write-Host "No SARIF output found - nothing to check."; exit 0 }
          $errorCount = 0
          foreach ($file in $sarifFiles) {
            $sarif = Get-Content $file.FullName -Raw | ConvertFrom-Json
            foreach ($run in $sarif.runs) {
              foreach ($result in $run.results) {
                $level = $result.level
                if (-not $level) {
                  $ruleId = $result.ruleId
                  $rule = $run.tool.driver.rules | Where-Object { $_.id -eq $ruleId } | Select-Object -First 1
                  $level = $rule.defaultConfiguration.level
                }
                if ($level -eq 'error') { $errorCount++ }
              }
            }
          }
          Write-Host "CodeQL error-severity findings: $errorCount"
          if ($errorCount -gt 0) {
            Write-Host "::error::CodeQL found $errorCount error-severity finding(s). See the Security tab for details."
            exit 1
          }
