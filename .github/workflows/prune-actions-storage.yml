name: prune actions storage

# Deletes every Actions cache and artifact except the newest one in each family
# (see tools/prune-actions-storage.ps1). Runs daily on the self-hosted Windows runner.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: prune-actions-storage
  cancel-in-progress: false

jobs:
  prune:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No sparse checkout: these self-hosted runners reuse workspaces, and a non-cone
        # sparse checkout stays in .git/config and breaks later full checkouts.
        with:
          fetch-depth: 1
      - name: Prune runs, caches, artifacts, and releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Hashtable splat: an array splat passes '-Repo' as a literal value to a script.
          $pruneArgs = @{ Repo = $env:GITHUB_REPOSITORY; DryRun = ($env:DRY_RUN -eq 'true') }
          ./tools/prune-actions-storage.ps1 @pruneArgs
