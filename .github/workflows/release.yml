# GoSurvey build / package / release pipeline — REQ-202, ADR-029.
#
# The build job calls the same Release validation action as PR CI; beta pushes continue to
# publish automatically and stable releases remain manual:
#
#   build             shared Release build and full test validation
#   package           Inno installer from the build artifacts; then:
#     any other branch  installer kept as a workflow artifact; nothing published
#     beta              installer published to the ROLLING `channel-beta` prerelease (assets replaced)
#     master            stable release, VERSION-GATED: tagged v<version> only if that tag is new
#
# The version gate is what makes a re-run against master safe to repeat. The release step is a
# no-op while project(VERSION) still matches the newest tag, so re-running the pipeline against
# master does not republish or retag. A failed beta/master run opens or updates its triage issue.
# Bumping the version in CMakeLists.txt IS the release.
#
# The stable version source (ADR-029 / ADR-074) is GOSURVEY_STABLE_VERSION in CMakeLists.txt.
# Beta derives a rolling patch version from that source and the previous rolling manifest.

name: release

on:
  # Stable publication remains manual; beta publishes when its source branch changes.
  push:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a publish in flight on the release branches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/beta' }}

permissions:
  contents: write   # required to create tags, releases, and upload assets
  actions: write    # sccache GitHub Actions cache backend

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    outputs:
      version: ${{ steps.ver.outputs.version }}
      full: ${{ steps.ver.outputs.full }}
      suffix: ${{ steps.ver.outputs.suffix }}
      quad: ${{ steps.ver.outputs.quad }}
      channel: ${{ steps.ver.outputs.channel }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.gate.outputs.publish }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Beta resolves its number against the current master version and prior beta manifest;
          # master also needs full history for stable tag inspection.
          fetch-depth: ${{ (github.ref_name == 'master' || github.ref_name == 'beta') && '0' || '1' }}

      # ---------------------------------------------------------------------
      # Version and channel
      # ---------------------------------------------------------------------
      - name: Resolve version and channel
        id: ver
        shell: pwsh
        env:
          # Same rule as the manifest step: a ref name is user-supplied text, so it is read from
          # the environment rather than pasted into the script. Branch names may contain
          # characters PowerShell treats as syntax.
          BRANCH_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = $env:BRANCH_NAME
          $betaVersion = ''
          if ($branch -eq 'master') {
            $line = Select-String -Path CMakeLists.txt -Pattern 'GOSURVEY_STABLE_VERSION\s+"([0-9]+\.[0-9]+\.[0-9]+)"'
            if (-not $line) { throw "Could not read GOSURVEY_STABLE_VERSION from CMakeLists.txt" }
            $version = $line.Matches[0].Groups[1].Value
            $channel  = 'stable'
            $full     = $version
            $suffix   = ''
            $quadLast = '0'
            $tag      = "v$version"
          } elseif ($branch -eq 'beta') {
            git fetch --no-tags origin master
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch master to resolve the stable beta baseline" }
            $stableSource = git show origin/master:CMakeLists.txt
            if ($LASTEXITCODE -ne 0) { throw "Could not read master CMakeLists.txt" }
            $stableMatch = [regex]::Match(($stableSource -join "`n"), 'GOSURVEY_STABLE_VERSION\s+"([0-9]+\.[0-9]+\.[0-9]+)"')
            if (-not $stableMatch.Success) {
              # Until the stable-version declaration reaches master, use its existing
              # project(VERSION) as the stable baseline.
              $stableMatch = [regex]::Match(($stableSource -join "`n"), 'project\(GoSurvey\s+VERSION\s+"?([0-9]+\.[0-9]+\.[0-9]+)"?')
            }
            if (-not $stableMatch.Success) { throw "Could not read the stable version from master CMakeLists.txt" }
            $stableVersion = [version]::Parse($stableMatch.Groups[1].Value)

            # The rolling release is the persistent counter. A missing asset is the first run;
            # any other download/parse problem fails closed rather than guessing a version.
            $manifestResponse = Invoke-WebRequest `
              -Uri "https://github.com/$($env:REPOSITORY)/releases/download/channel-beta/latest.json" `
              -SkipHttpErrorCheck
            $previousManifest = $null
            if ($manifestResponse.StatusCode -eq 200) {
              try {
                $manifestContent = $manifestResponse.Content
                if ($manifestContent -is [byte[]]) {
                  $manifestContent = [Text.Encoding]::UTF8.GetString($manifestContent)
                }
                $previousManifest = ConvertFrom-Json -InputObject $manifestContent
              }
              catch { throw "Could not parse the previous beta manifest: $($_.Exception.Message)" }
              if ($previousManifest.version -notmatch '^\d+\.\d+\.\d+$') {
                throw "Previous beta manifest has an invalid version: '$($previousManifest.version)'"
              }
              # The existing channel-beta manifest predates sourceCommit. Permit that one
              # legacy shape; the next published manifest writes the provenance field.
              $sourceCommitProperty = $previousManifest.PSObject.Properties['sourceCommit']
              if ($sourceCommitProperty -and ($null -eq $sourceCommitProperty.Value -or $sourceCommitProperty.Value -notmatch '^[0-9a-fA-F]{40}$')) {
                throw "Previous beta manifest has an invalid sourceCommit: '$($sourceCommitProperty.Value)'"
              }
            } elseif ($manifestResponse.StatusCode -ne 404) {
              throw "Could not fetch previous beta manifest (HTTP $($manifestResponse.StatusCode))"
            } else {
              # A missing manifest is a first run only when the rolling release is absent too.
              # Otherwise the persistent version counter was lost; stop rather than reset it.
              $releaseResponse = Invoke-WebRequest `
                -Uri "https://api.github.com/repos/$($env:REPOSITORY)/releases/tags/channel-beta" `
                -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
                -SkipHttpErrorCheck
              if ($releaseResponse.StatusCode -eq 200) {
                throw "channel-beta exists but latest.json is missing. Restore latest.json before publishing beta again."
              }
              if ($releaseResponse.StatusCode -ne 404) {
                throw "Could not check the channel-beta release (HTTP $($releaseResponse.StatusCode))"
              }
            }

            $sameCommit = $previousManifest -and $previousManifest.sourceCommit -eq $env:SOURCE_COMMIT
            if ($sameCommit) {
              $version = $previousManifest.version
            } else {
              $baseVersion = $stableVersion
              if ($previousManifest) {
                $previousVersion = [version]::Parse($previousManifest.version)
                if ($previousVersion -gt $baseVersion) { $baseVersion = $previousVersion }
              }
              $version = '{0}.{1}.{2}' -f $baseVersion.Major, $baseVersion.Minor, ($baseVersion.Build + 1)
            }

            $channel  = 'beta'
            $betaVersion = $version
            $suffix   = ''
            $full     = $version
            $quadLast = '0'
            $tag      = 'channel-beta'
          } else {
            $line = Select-String -Path CMakeLists.txt -Pattern 'GOSURVEY_STABLE_VERSION\s+"([0-9]+\.[0-9]+\.[0-9]+)"'
            if (-not $line) { throw "Could not read GOSURVEY_STABLE_VERSION from CMakeLists.txt" }
            $version = $line.Matches[0].Groups[1].Value
            $channel  = 'none'
            $suffix   = "-dev.${{ github.run_number }}"
            $full     = "$version$suffix"
            $quadLast = "${{ github.run_number }}"
            $tag      = ''
          }

          "version=$version"   | Out-File $env:GITHUB_OUTPUT -Append
          "full=$full"         | Out-File $env:GITHUB_OUTPUT -Append
          "suffix=$suffix"     | Out-File $env:GITHUB_OUTPUT -Append
          "quad=$version.$quadLast" | Out-File $env:GITHUB_OUTPUT -Append
          "buildField=$quadLast" | Out-File $env:GITHUB_OUTPUT -Append
          "channel=$channel"   | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag"           | Out-File $env:GITHUB_OUTPUT -Append
          "betaVersion=$betaVersion" | Out-File $env:GITHUB_OUTPUT -Append
          if ($branch -eq 'beta') { "sourceCommit=$($env:SOURCE_COMMIT)" | Out-File $env:GITHUB_OUTPUT -Append }
          Write-Host "version=$version full=$full channel=$channel tag=$tag"

      - name: Check whether this version was already released
        id: gate
        if: github.ref_name == 'master'
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          # Ask the remote, not the local clone: a tag could have been pushed by another run.
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ([string]::IsNullOrWhiteSpace($existing)) {
            "publish=true" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "$tag does not exist - this push publishes a release."
          } else {
            "publish=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "$tag already exists - nothing to publish. Bump project(VERSION) to release."
          }

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------
      - name: Release build and test validation
        uses: ./.github/actions/release-validation
        with:
          version-suffix: ${{ steps.ver.outputs.suffix }}
          version-build: ${{ steps.ver.outputs.buildField }}
          beta-version: ${{ steps.ver.outputs.betaVersion }}
          test-parallel: '8'

      - name: Test release PDB archive validation
        shell: pwsh
        run: ./tools/test-archive-release-pdb.ps1

      - name: Archive private release PDB
        # REQ-425 / issue #1004: archive symbols from this exact build before any package
        # artifact is staged. The R2 key is separate from the crash-dumps/ lifecycle prefix.
        if: github.ref_name == 'beta' || (github.ref_name == 'master' && steps.gate.outputs.publish == 'true')
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ./tools/archive-release-pdb.ps1 `
            -ExecutablePath 'build/GoSurvey.exe' `
            -PdbPath 'build/.cmake/release/symbols/GoSurvey.pdb' `
            -Version '${{ steps.ver.outputs.version }}' `
            -Commit (git rev-parse --short=12 HEAD)

      - name: REQ-336 assert whats-new.md is packaged
        # Runtime falls back if the file is missing; CI must still refuse to ship without it.
        shell: pwsh
        run: |
          foreach ($path in @("build/resources/whats-new.md", "build/resources/whats-new-bg.png",
                              "build/resources/splash-bg.png")) {
            if (-not (Test-Path $path)) {
              throw "REQ-336/REQ-093: missing $path after build — installer would ship without bundled UI assets."
            }
            Write-Host "OK: $path present"
          }

      - name: Stage app-local Microsoft VC runtime (x64)
        shell: pwsh
        run: |
          # ADR-073: bootstrap and in-app updates are non-elevated, so ship the licensed
          # release CRT DLLs beside GoSurvey.exe. Keep this sourced from the active MSVC
          # redist directory and refresh it on every release build.
          $redistRoot = Join-Path $env:VCToolsRedistDir 'x64'
          $crtDirs = @(Get-ChildItem -LiteralPath $redistRoot -Directory -Filter 'Microsoft.VC*.CRT' |
            Sort-Object Name -Descending)
          if ($crtDirs.Count -eq 0) {
            throw "No x64 Microsoft VC CRT redistributable folder found under '$redistRoot'."
          }
          $crtDir = $crtDirs[0].FullName
          $crtDlls = @(Get-ChildItem -LiteralPath $crtDir -File -Filter '*.dll')
          if ($crtDlls.Count -eq 0) { throw "No runtime DLLs found in '$crtDir'." }
          foreach ($required in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not ($crtDlls.Name -contains $required)) {
              throw "Required app-local runtime '$required' is missing from '$crtDir'."
            }
          }
          foreach ($dll in $crtDlls) {
            Copy-Item -LiteralPath $dll.FullName -Destination 'build' -Force
          }
          Write-Host "Staged $($crtDlls.Count) runtime DLLs from $crtDir"

      - name: sccache stats
        if: always()
        shell: pwsh
        run: |
          if ($env:SCCACHE_PATH) { & $env:SCCACHE_PATH --show-stats }
          else { sccache --show-stats }

      - name: Upload binaries for packaging
        uses: actions/upload-artifact@v4
        with:
          name: gosurvey-bin
          path: |
            build/GoSurvey.exe
            build/*.dll
            build/qt.conf
            build/qt-plugins/
            build/resources/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    # REQ-202 / D-2026-08-31-a (issue #142): the installer is built only where it
    # is published (beta, master) or explicitly asked for (workflow_dispatch).
    # A feature-branch push runs the build job only; use "Run workflow" to get an
    # installer artifact on demand.
    if: github.ref_name == 'beta' || github.ref_name == 'master' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download binaries
        # upload-artifact@v4 strips the shared `build/` prefix from the uploaded
        # paths, so the archive contains the app/runtime files at its root. Unpack into
        # build/ so installer/GoSurvey.iss finds the Qt deployment tree.
        uses: actions/download-artifact@v4
        with:
          name: gosurvey-bin
          path: build

      - name: REQ-336 assert whats-new.md in packaging inputs
        shell: pwsh
        run: |
          foreach ($path in @("build/resources/whats-new.md", "build/resources/whats-new-bg.png",
                              "build/resources/splash-bg.png")) {
            if (-not (Test-Path $path)) {
              throw "REQ-336/REQ-093: missing $path in packaging artifact."
            }
          }

      # ---------------------------------------------------------------------
      # Package
      # ---------------------------------------------------------------------
      - name: Download VC++ redistributable (x64)
        shell: pwsh
        run: |
          $out = 'build\vc_redist.x64.exe'
          if (-not (Test-Path $out)) {
            Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $out
          }
          if (-not (Test-Path $out)) { throw 'Failed to download vc_redist.x64.exe for the installer.' }

      - name: Build the installer
        shell: pwsh
        run: |
          # Keep these runtime requirements aligned with tools/verify-qt-deployment.ps1. The
          # installer must remain usable after the Store downloads it once and the machine goes
          # offline; checking for any DLL is not enough to prove the Qt runtime is complete.
          foreach ($path in @('build\GoSurvey.exe', 'build\Qt6Core.dll', 'build\Qt6Gui.dll',
                              'build\Qt6Widgets.dll', 'build\Qt6OpenGL.dll',
                              'build\Qt6OpenGLWidgets.dll', 'build\pdfium.dll',
                              'build\qt.conf', 'build\qt-plugins\platforms\qwindows.dll',
                              'build\resources\default-template.gst',
                              'build\vc_redist.x64.exe')) {
            if (-not (Test-Path $path)) {
              throw "Expected $path in packaging inputs; offline installer would be incomplete."
            }
          }
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not present on the runner image - installing."
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install attempt" }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName `
            "/DAppVersion=${{ needs.build.outputs.full }}" `
            "/DAppVersionQuad=${{ needs.build.outputs.quad }}" `
            installer\GoSurvey.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Sign the installer
        # PLACEHOLDER — deliberately a no-op (ADR-029, decision-log D5). The installer ships
        # unsigned for now, so SmartScreen will warn and the manifest's SHA-256 proves integrity
        # but not authenticity. The step exists so signing drops in without restructuring the
        # pipeline. Since the 2023 CA/Browser hardware-key rules this needs a cloud signing
        # service, NOT a .pfx in a repository secret.
        #
        # 2026-10-09: chose SignPath Foundation (signpath.org), which signs OSS projects for
        # free — but their application requires the project to already be independently
        # findable (a Google search for the project name, a homepage that isn't just the bare
        # repo). GoSurvey isn't there yet, so the application is ON HOLD, not submitted. This
        # step stays a no-op until that's resolved. DO NOT wire in SignPath until the account
        # exists and the four secrets below are confirmed present in repo settings.
        #
        # Once SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
        # SIGNPATH_SIGNING_POLICY exist as repo secrets, replace this step's `run:` block with:
        #
        #   - name: Sign the installer
        #     uses: signpath/github-action-submit-signing-request@v1
        #     with:
        #       api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        #       organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        #       project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        #       signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY }}
        #       artifact-configuration-slug: 'installer'
        #       github-artifact-id: <id of an installer\Output\*.exe artifact uploaded just before this step>
        #       wait-for-completion: true
        #       output-artifact-directory: 'installer\Output\signed'
        #     # then replace installer\Output\*.exe with the signed copy before the manifest/publish steps.
        shell: pwsh
        run: Write-Host "Code signing not configured - shipping unsigned (recorded technical debt; SignPath application on hold, see comment above)."

      - name: Write the update manifest
        id: manifest
        shell: pwsh
        env:
          # Untrusted context NEVER goes inline into `run:`. A `${{ }}` expression is substituted
          # into the script text before pwsh parses it, so a commit message containing a quote
          # breaks the script -- and one containing PowerShell would EXECUTE on the runner, which
          # holds a contents:write token. Routed through the environment, the value is data the
          # script reads at runtime and can never be parsed as code.
          # (Found the accidental way: a commit message containing "MSVC toolchain" ended a string
          # literal and failed the step with `Unexpected token 'MSVC'`.)
          #
          # Used ONLY to look for the `BREAKING-DRAWINGS:` marker. User-facing release notes come
          # from RELEASE_NOTES.md — a commit message must never reach the update dialog.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $installer = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer produced in installer\Output" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $tag = "${{ needs.build.outputs.tag }}"
          $repo = "${{ github.repository }}"

          # The URL is built from the tag the asset will be published under, so the manifest is
          # correct at the moment it is written rather than depending on a later redirect.
          $url = "https://github.com/$repo/releases/download/$tag/$($installer.Name)"

          # This schema version belongs to the JSON payload embedded in DWG. The manifest key
          # remains gsFormatVersion for compatibility with already deployed updater clients.
          # The CLIENT compares it against its own compiled-in value, so no release history has to
          # be consulted here and the comparison happens where the truth is actually known.
          $fmtLine = Select-String -Path src\io\GsMigrate.hpp -Pattern 'kGsFormatVersion\s*=\s*(\d+)'
          if (-not $fmtLine) { throw "Could not read kGsFormatVersion from src\io\GsMigrate.hpp" }
          $gsFormatVersion = [int]$fmtLine.Matches[0].Groups[1].Value

          # Release notes come from RELEASE_NOTES.md, NOT from the commit message.
          #
          # The manifest's notes are shown to surveyors inside the update dialog. Commit messages
          # are written for developers and are full of things an end user should never be shown --
          # file paths, requirement numbers, compiler behaviour. Piping them straight through put
          # "the installer registers .gs with shell\open\command..." is a historical phrase
          # denied from release notes; it is not current file-association guidance.
          # how this was caught.
          #
          # The section key is the plain three-part version, so every beta in a cycle shows the
          # notes for the release it is previewing.
          #
          # Read from the step OUTPUT, not from $version: each `run:` block is its own PowerShell
          # process, so a variable set in the resolve step is empty here. It failed silently the
          # first time -- the regex became "^##\s+\s*$", matched nothing, and every release got the
          # fallback line. Safe to interpolate: this value is a [0-9.]+ string from a regex.
          $version = "${{ needs.build.outputs.version }}"
          $notes = ""
          if (Test-Path RELEASE_NOTES.md) {
            $lines = Get-Content RELEASE_NOTES.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s+$([regex]::Escape($version))\s*$") { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $collected = @()
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s+') { break }   # next version section
                $collected += $lines[$i]
              }
              $notes = ($collected -join "`n").Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            # Never fall back to the commit message. A bland line is better than leaking
            # developer detail into a surveyor's update prompt.
            $notes = "See the releases page for what changed in this version."
            Write-Host "::warning::No RELEASE_NOTES.md section for $version - using the fallback text."
          }

          # A GENUINE break -- existing drawings will not open -- cannot be detected automatically,
          # because it need not move the format version at all. It is declared by the release
          # author with a marker line in the commit message:
          #
          #   BREAKING-DRAWINGS: Surfaces built before 0.6 must be rebuilt.
          #
          # Read from the environment, never interpolated into this script (see the env: block).
          $breaks  = $false
          $warning = ""
          $msg = $env:HEAD_COMMIT_MESSAGE
          if ($msg) {
            $m = [regex]::Match($msg, '(?m)^BREAKING-DRAWINGS:\s*(.+)$')
            if ($m.Success) {
              $breaks  = $true
              $warning = $m.Groups[1].Value.Trim()
              Write-Host "Release declares a drawing-breaking change: $warning"
            }
          }

          $manifest = [ordered]@{
            version     = "${{ needs.build.outputs.full }}"
            channel     = "${{ needs.build.outputs.channel }}"
            installerUrl= $url
            sha256      = $sha
            size        = $installer.Length
            releasedAt  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            # Reserved so that making an update mandatory later is a policy change, not a
            # protocol change: old clients already parse and ignore this field.
            mandatory   = $false
            gsFormatVersion = $gsFormatVersion
            compatibility   = [ordered]@{
              breaksExistingDrawings = $breaks
              warning                = $warning
            }
            notes       = $notes
          }
          if ($env:GITHUB_REF_NAME -eq 'beta') {
            # This makes retries idempotent: the version resolver can recognize the exact source
            # commit already represented by the rolling manifest.
            $manifest['sourceCommit'] = $env:GITHUB_SHA
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 installer\Output\latest.json
          if ($env:GITHUB_REF_NAME -eq 'master') {
            @(
              "Installer URL: $url"
              "SHA-256: $sha"
              'Install parameters: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-'
              'UAC: A Windows UAC prompt is permitted.'
            ) | Set-Content -Path installer\Output\store-submission.txt -Encoding UTF8
          }
          # Same text, as Markdown, for the GitHub release page body (see the publish steps).
          Set-Content -Path installer\Output\release-body.md -Value $notes -Encoding UTF8
          "installer=$($installer.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          "name=$($installer.Name)"          | Out-File $env:GITHUB_OUTPUT -Append
          Get-Content installer\Output\latest.json

      # ---------------------------------------------------------------------
      # Publish
      # ---------------------------------------------------------------------
      - name: Upload artifact (non-release branches)
        if: github.ref_name != 'master' && github.ref_name != 'beta'
        uses: actions/upload-artifact@v4
        with:
          name: GoSurvey-${{ needs.build.outputs.full }}
          path: |
            installer/Output/*.exe
            installer/Output/latest.json
          retention-days: 14

      - name: Publish the rolling beta prerelease
        if: github.ref_name == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A queued beta run can finish after a newer commit. Check the branch tip immediately
          # before touching the rolling release so an older build cannot replace newer assets.
          $remoteBeta = git ls-remote origin refs/heads/beta
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve current beta head before publishing" }
          $remoteBetaSha = ($remoteBeta -split '\s+')[0]
          if ([string]::IsNullOrWhiteSpace($remoteBetaSha)) { throw "Could not resolve current beta head before publishing" }
          if ($remoteBetaSha -ne $env:GITHUB_SHA) {
            Write-Host "Skipping stale beta build $($env:GITHUB_SHA); current beta head is $remoteBetaSha."
            exit 0
          }

          # One permanent prerelease row, not one per push. `--clobber` replaces the assets in
          # place, which is what gives the beta manifest a fixed, forever-valid URL.
          $exists = gh release view channel-beta 2>$null
          if (-not $exists) {
            gh release create channel-beta --prerelease --title "GoSurvey beta (rolling)" `
              --notes "Latest beta build. Assets here are replaced on every push to the beta branch."
          }
          gh release upload channel-beta `
            "installer\Output\${{ steps.manifest.outputs.name }}" `
            "installer\Output\latest.json" --clobber

          # Prune superseded installers. --clobber only replaces an asset of the SAME name, and
          # the installer filename carries the version, so without this every beta adds ~6 MB to
          # the release forever and "a single rolling prerelease" stops being true. latest.json
          # keeps its name and is genuinely clobbered, so it is left alone.
          #
          # Pruning AFTER the upload, not before: if the upload fails, the release keeps the
          # previous installer and the manifest still resolves, rather than being left empty.
          $keep = "${{ steps.manifest.outputs.name }}"
          $stale = gh release view channel-beta --json assets -q '.assets[].name' |
                   Where-Object { $_ -like 'GoSurvey-*-Installer.exe' -and $_ -ne $keep }
          foreach ($asset in $stale) {
            Write-Host "Deleting superseded asset: $asset"
            gh release delete-asset channel-beta $asset --yes
          }

          # Title AND body refreshed each push, so the rolling release page describes the build
          # currently attached to it rather than whichever one created it.
          gh release edit channel-beta `
            --title "GoSurvey ${{ needs.build.outputs.full }} (beta)" `
            --notes-file installer\Output\release-body.md

      - name: Publish the stable release
        if: github.ref_name == 'master' && needs.build.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `v` prefix, normalising the inconsistency in the existing tags (v0.1 ... v0.3.0, then
          # a bare 0.4.0). The old tag is left alone rather than rewriting published history.
          # The release BODY is the authored RELEASE_NOTES.md section, not --generate-notes.
          # The releases page is where the README sends users to download, so it is a
          # user-facing surface: auto-generated notes would put the commit log in front of
          # surveyors, which is the same mistake the manifest notes already had to be rescued
          # from. The manifest step wrote the notes to a file; files persist across steps in a
          # job, which avoids both the multi-line step-output delimiter dance and any chance of
          # notes text being interpolated into this script.
          gh release create "v${{ needs.build.outputs.version }}" `
            "installer\Output\${{ steps.manifest.outputs.name }}" `
            "installer\Output\latest.json" `
            "installer\Output\store-submission.txt" `
            --title "GoSurvey ${{ needs.build.outputs.version }}" `
            --notes-file installer\Output\release-body.md

      - name: Report that the version gate held
        if: github.ref_name == 'master' && needs.build.outputs.publish == 'false'
        run: echo "v${{ needs.build.outputs.version }} is already released. Bump project(VERSION) in CMakeLists.txt to ship a new one."

  report-release-failure:
    name: report release failure
    needs: [build, package]
    if: >-
      always() &&
      (needs.build.result == 'failure' || needs.package.result == 'failure') &&
      (github.ref_name == 'beta' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out release workflow source
        uses: actions/checkout@v4

      - name: Create or update release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoLogo -NoProfile -File .github/scripts/report_release_failure.ps1
