# GoSurvey build / package / release pipeline — REQ-202, ADR-029.
#
# Two jobs, three publish outcomes, decided by where the push landed:
#
#   build             compile + ctest on every push (REQ-202 gate)
#   package           Inno installer from the build artifacts; then:
#     any other branch  installer kept as a workflow artifact; nothing published
#     beta              installer published to the ROLLING `channel-beta` prerelease (assets replaced)
#     master            stable release, VERSION-GATED: tagged v<version> only if that tag is new
#
# The version gate is what makes "push to master" safe to repeat. The release step is a no-op
# while project(VERSION) still matches the newest tag, so a docs push to master does not
# republish, retag, or notify users. Bumping the version in CMakeLists.txt IS the release.
#
# The version has exactly one source (ADR-029 (a)): project(VERSION) in CMakeLists.txt. It is
# read here and passed onward; nothing in this file hard-codes a version number.

name: release

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a publish in flight on the release branches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/beta' }}

permissions:
  contents: write   # required to create tags, releases, and upload assets
  actions: write    # sccache GitHub Actions cache backend

env:
  # Where FetchContent puts its dependencies; matches the ninja-release preset's binaryDir.
  DEPS_CACHE_PATH: build/_deps

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    outputs:
      version: ${{ steps.ver.outputs.version }}
      full: ${{ steps.ver.outputs.full }}
      suffix: ${{ steps.ver.outputs.suffix }}
      quad: ${{ steps.ver.outputs.quad }}
      channel: ${{ steps.ver.outputs.channel }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.gate.outputs.publish }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history only on master (version-gate / tag inspection). Feature and beta
          # pushes do not need it; the gate itself asks the remote via git ls-remote.
          fetch-depth: ${{ github.ref_name == 'master' && '0' || '1' }}

      - name: Set up MSVC
        # Puts cl.exe, the linker and the Windows SDK on PATH. Required: CMakePresets pins the
        # compiler to `cl`, and the Ninja generator does not locate MSVC on its own the way the
        # Visual Studio generator does — so without this, configure fails outright rather than
        # quietly picking up some other compiler. That loud failure is deliberate (see below).
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure Ninja
        # The repo's CMakePresets.json uses the Ninja generator. windows-latest already ships
        # ninja; only download the official zip if PATH does not have it. Chocolatey is not used
        # — it added ~15–20s to every run for a tool that is already on the image.
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
            Write-Host "Using $((Get-Command ninja).Source) ($(ninja --version))"
            exit 0
          }
          $ver = '1.12.1'
          $dir = Join-Path $env:RUNNER_TEMP 'ninja'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'ninja.zip'
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$ver/ninja-win.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Write-Host "Installed ninja $ver to $dir"

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_CACHE_PATH }}
          # CMakeLists.txt holds every pinned dependency ref (glfw 3.4, the imgui SHA, glew
          # 2.2.0, the pdfium URL, Catch2 v3.5.2), so hashing it can never serve a STALE
          # dependency tree — that is the property that matters for correctness.
          #
          # It is a coarse key, though: any edit to the file misses, including a version bump or
          # adding a source file, neither of which touches a dependency. `restore-keys` is what
          # makes that cheap rather than a full re-download — a miss falls back to the newest
          # `deps-<os>-*` entry, which is almost always the right tree. Narrowing the key to just
          # the FetchContent block would need that block in its own file; not worth it while the
          # fallback keeps a miss at seconds rather than minutes.
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # Version and channel
      # ---------------------------------------------------------------------
      - name: Resolve version and channel
        id: ver
        shell: pwsh
        env:
          # Same rule as the manifest step: a ref name is user-supplied text, so it is read from
          # the environment rather than pasted into the script. Branch names may contain
          # characters PowerShell treats as syntax.
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          $line = Select-String -Path CMakeLists.txt -Pattern 'project\(GoSurvey VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $line) { throw "Could not read project(VERSION) from CMakeLists.txt" }
          $version = $line.Matches[0].Groups[1].Value

          $branch = $env:BRANCH_NAME
          if ($branch -eq 'master') {
            $channel  = 'stable'
            $full     = $version
            $suffix   = ''
            $quadLast = '0'
            $tag      = "v$version"
          } elseif ($branch -eq 'beta') {
            $channel  = 'beta'
            # The run number is monotonic per workflow, so betas order correctly within a
            # cycle: 0.5.0-beta.2 < 0.5.0-beta.10 (numeric compare, not string).
            $suffix   = "-beta.${{ github.run_number }}"
            $full     = "$version$suffix"
            $quadLast = "${{ github.run_number }}"
            $tag      = 'channel-beta'
          } else {
            $channel  = 'none'
            $suffix   = "-dev.${{ github.run_number }}"
            $full     = "$version$suffix"
            $quadLast = "${{ github.run_number }}"
            $tag      = ''
          }

          "version=$version"   | Out-File $env:GITHUB_OUTPUT -Append
          "full=$full"         | Out-File $env:GITHUB_OUTPUT -Append
          "suffix=$suffix"     | Out-File $env:GITHUB_OUTPUT -Append
          "quad=$version.$quadLast" | Out-File $env:GITHUB_OUTPUT -Append
          "channel=$channel"   | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag"           | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version=$version full=$full channel=$channel tag=$tag"

      - name: Check whether this version was already released
        id: gate
        if: github.ref_name == 'master'
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          # Ask the remote, not the local clone: a tag could have been pushed by another run.
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ([string]::IsNullOrWhiteSpace($existing)) {
            "publish=true" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "$tag does not exist - this push publishes a release."
          } else {
            "publish=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "$tag already exists - nothing to publish. Bump project(VERSION) to release."
          }

      # ---------------------------------------------------------------------
      # Build and test
      # ---------------------------------------------------------------------
      - name: Configure
        # The compiler is NOT chosen here. CMakePresets pins `cl` for both presets, so CI and a
        # developer machine compile with the same toolchain by construction. Passing it here
        # instead would recreate exactly the split that broke the first CI run: ninja-release
        # pinned nothing, CMake took whatever was first on PATH, and local (clang) silently
        # diverged from CI (cl) until the build failed on a construct only one of them rejects.
        run: >
          cmake --preset ninja-release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DGOSURVEY_VERSION_SUFFIX="${{ steps.ver.outputs.suffix }}"
          -DGOSURVEY_VERSION_BUILD=${{ github.run_number }}

      - name: Build
        run: cmake --build build

      - name: Test
        # Gates publication: a failing suite fails the job before any package/release step runs.
        run: ctest --test-dir build --output-on-failure

      - name: sccache stats
        if: always()
        shell: pwsh
        run: |
          if ($env:SCCACHE_PATH) { & $env:SCCACHE_PATH --show-stats }
          else { sccache --show-stats }

      - name: Upload binaries for packaging
        uses: actions/upload-artifact@v4
        with:
          name: gosurvey-bin
          path: |
            build/GoSurvey.exe
            build/pdfium.dll
            build/resources/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: gosurvey-bin
          path: .

      # ---------------------------------------------------------------------
      # Package
      # ---------------------------------------------------------------------
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not present on the runner image - installing."
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install attempt" }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName `
            "/DAppVersion=${{ needs.build.outputs.full }}" `
            "/DAppVersionQuad=${{ needs.build.outputs.quad }}" `
            installer\GoSurvey.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Sign the installer
        # PLACEHOLDER — deliberately a no-op (ADR-029, decision-log D5). The installer ships
        # unsigned for now, so SmartScreen will warn and the manifest's SHA-256 proves integrity
        # but not authenticity. The step exists so signing drops in without restructuring the
        # pipeline. Since the 2023 CA/Browser hardware-key rules this needs a cloud signing
        # service (Azure Trusted Signing / SSL.com eSigner / DigiCert KeyLocker), NOT a .pfx in
        # a repository secret.
        shell: pwsh
        run: Write-Host "Code signing not configured - shipping unsigned (recorded technical debt)."

      - name: Write the update manifest
        id: manifest
        shell: pwsh
        env:
          # Untrusted context NEVER goes inline into `run:`. A `${{ }}` expression is substituted
          # into the script text before pwsh parses it, so a commit message containing a quote
          # breaks the script -- and one containing PowerShell would EXECUTE on the runner, which
          # holds a contents:write token. Routed through the environment, the value is data the
          # script reads at runtime and can never be parsed as code.
          # (Found the accidental way: a commit message containing "MSVC toolchain" ended a string
          # literal and failed the step with `Unexpected token 'MSVC'`.)
          #
          # Used ONLY to look for the `BREAKING-DRAWINGS:` marker. User-facing release notes come
          # from RELEASE_NOTES.md — a commit message must never reach the update dialog.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $installer = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer produced in installer\Output" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $tag = "${{ needs.build.outputs.tag }}"
          $repo = "${{ github.repository }}"

          # The URL is built from the tag the asset will be published under, so the manifest is
          # correct at the moment it is written rather than depending on a later redirect.
          $url = "https://github.com/$repo/releases/download/$tag/$($installer.Name)"

          # The .gs format version this build writes, read from the one place that defines it.
          # The CLIENT compares it against its own compiled-in value, so no release history has to
          # be consulted here and the comparison happens where the truth is actually known.
          $fmtLine = Select-String -Path src\io\GsMigrate.hpp -Pattern 'kGsFormatVersion\s*=\s*(\d+)'
          if (-not $fmtLine) { throw "Could not read kGsFormatVersion from src\io\GsMigrate.hpp" }
          $gsFormatVersion = [int]$fmtLine.Matches[0].Groups[1].Value

          # Release notes come from RELEASE_NOTES.md, NOT from the commit message.
          #
          # The manifest's notes are shown to surveyors inside the update dialog. Commit messages
          # are written for developers and are full of things an end user should never be shown --
          # file paths, requirement numbers, compiler behaviour. Piping them straight through put
          # "the installer registers .gs with shell\open\command..." in front of users, which is
          # how this was caught.
          #
          # The section key is the plain three-part version, so every beta in a cycle shows the
          # notes for the release it is previewing.
          #
          # Read from the step OUTPUT, not from $version: each `run:` block is its own PowerShell
          # process, so a variable set in the resolve step is empty here. It failed silently the
          # first time -- the regex became "^##\s+\s*$", matched nothing, and every release got the
          # fallback line. Safe to interpolate: this value is a [0-9.]+ string from a regex.
          $version = "${{ needs.build.outputs.version }}"
          $notes = ""
          if (Test-Path RELEASE_NOTES.md) {
            $lines = Get-Content RELEASE_NOTES.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s+$([regex]::Escape($version))\s*$") { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $collected = @()
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s+') { break }   # next version section
                $collected += $lines[$i]
              }
              $notes = ($collected -join "`n").Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            # Never fall back to the commit message. A bland line is better than leaking
            # developer detail into a surveyor's update prompt.
            $notes = "See the releases page for what changed in this version."
            Write-Host "::warning::No RELEASE_NOTES.md section for $version - using the fallback text."
          }

          # A GENUINE break -- existing drawings will not open -- cannot be detected automatically,
          # because it need not move the format version at all. It is declared by the release
          # author with a marker line in the commit message:
          #
          #   BREAKING-DRAWINGS: Surfaces built before 0.6 must be rebuilt.
          #
          # Read from the environment, never interpolated into this script (see the env: block).
          $breaks  = $false
          $warning = ""
          $msg = $env:HEAD_COMMIT_MESSAGE
          if ($msg) {
            $m = [regex]::Match($msg, '(?m)^BREAKING-DRAWINGS:\s*(.+)$')
            if ($m.Success) {
              $breaks  = $true
              $warning = $m.Groups[1].Value.Trim()
              Write-Host "Release declares a drawing-breaking change: $warning"
            }
          }

          $manifest = [ordered]@{
            version     = "${{ needs.build.outputs.full }}"
            channel     = "${{ needs.build.outputs.channel }}"
            installerUrl= $url
            sha256      = $sha
            size        = $installer.Length
            releasedAt  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            # Reserved so that making an update mandatory later is a policy change, not a
            # protocol change: old clients already parse and ignore this field.
            mandatory   = $false
            gsFormatVersion = $gsFormatVersion
            compatibility   = [ordered]@{
              breaksExistingDrawings = $breaks
              warning                = $warning
            }
            notes       = $notes
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 installer\Output\latest.json
          # Same text, as Markdown, for the GitHub release page body (see the publish steps).
          Set-Content -Path installer\Output\release-body.md -Value $notes -Encoding UTF8
          "installer=$($installer.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          "name=$($installer.Name)"          | Out-File $env:GITHUB_OUTPUT -Append
          Get-Content installer\Output\latest.json

      # ---------------------------------------------------------------------
      # Publish
      # ---------------------------------------------------------------------
      - name: Upload artifact (non-release branches)
        if: github.ref_name != 'master' && github.ref_name != 'beta'
        uses: actions/upload-artifact@v4
        with:
          name: GoSurvey-${{ needs.build.outputs.full }}
          path: |
            installer/Output/*.exe
            installer/Output/latest.json
          retention-days: 14

      - name: Publish the rolling beta prerelease
        if: github.ref_name == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One permanent prerelease row, not one per push. `--clobber` replaces the assets in
          # place, which is what gives the beta manifest a fixed, forever-valid URL.
          $exists = gh release view channel-beta 2>$null
          if (-not $exists) {
            gh release create channel-beta --prerelease --title "GoSurvey beta (rolling)" `
              --notes "Latest beta build. Assets here are replaced on every push to the beta branch."
          }
          gh release upload channel-beta `
            "installer\Output\${{ steps.manifest.outputs.name }}" `
            "installer\Output\latest.json" --clobber

          # Prune superseded installers. --clobber only replaces an asset of the SAME name, and
          # the installer filename carries the version, so without this every beta adds ~6 MB to
          # the release forever and "a single rolling prerelease" stops being true. latest.json
          # keeps its name and is genuinely clobbered, so it is left alone.
          #
          # Pruning AFTER the upload, not before: if the upload fails, the release keeps the
          # previous installer and the manifest still resolves, rather than being left empty.
          $keep = "${{ steps.manifest.outputs.name }}"
          $stale = gh release view channel-beta --json assets -q '.assets[].name' |
                   Where-Object { $_ -like 'GoSurvey-*-Installer.exe' -and $_ -ne $keep }
          foreach ($asset in $stale) {
            Write-Host "Deleting superseded asset: $asset"
            gh release delete-asset channel-beta $asset --yes
          }

          # Title AND body refreshed each push, so the rolling release page describes the build
          # currently attached to it rather than whichever one created it.
          gh release edit channel-beta `
            --title "GoSurvey ${{ needs.build.outputs.full }} (beta)" `
            --notes-file installer\Output\release-body.md

      - name: Publish the stable release
        if: github.ref_name == 'master' && needs.build.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `v` prefix, normalising the inconsistency in the existing tags (v0.1 ... v0.3.0, then
          # a bare 0.4.0). The old tag is left alone rather than rewriting published history.
          # The release BODY is the authored RELEASE_NOTES.md section, not --generate-notes.
          # The releases page is where the README sends users to download, so it is a
          # user-facing surface: auto-generated notes would put the commit log in front of
          # surveyors, which is the same mistake the manifest notes already had to be rescued
          # from. The manifest step wrote the notes to a file; files persist across steps in a
          # job, which avoids both the multi-line step-output delimiter dance and any chance of
          # notes text being interpolated into this script.
          gh release create "v${{ needs.build.outputs.version }}" `
            "installer\Output\${{ steps.manifest.outputs.name }}" `
            "installer\Output\latest.json" `
            --title "GoSurvey ${{ needs.build.outputs.version }}" `
            --notes-file installer\Output\release-body.md

      - name: Report that the version gate held
        if: github.ref_name == 'master' && needs.build.outputs.publish == 'false'
        run: echo "v${{ needs.build.outputs.version }} is already released. Bump project(VERSION) in CMakeLists.txt to ship a new one."
