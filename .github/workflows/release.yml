# GoSurvey build / package / release pipeline — REQ-202, ADR-029.
#
# One job, three outcomes, decided by where the push landed:
#
#   any other branch  build + test; installer kept as a workflow artifact; nothing published
#   beta              installer published to the ROLLING `channel-beta` prerelease (assets replaced)
#   master            stable release, VERSION-GATED: tagged v<version> only if that tag is new
#
# The version gate is what makes "push to master" safe to repeat. The release step is a no-op
# while project(VERSION) still matches the newest tag, so a docs push to master does not
# republish, retag, or notify users. Bumping the version in CMakeLists.txt IS the release.
#
# The version has exactly one source (ADR-029 (a)): project(VERSION) in CMakeLists.txt. It is
# read here and passed onward; nothing in this file hard-codes a version number.

name: release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write   # required to create tags, releases, and upload assets

env:
  # Where FetchContent puts its dependencies; matches the ninja-release preset's binaryDir.
  DEPS_CACHE_PATH: build/_deps

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history + tags: the version gate asks whether v<version> already exists.
          fetch-depth: 0

      - name: Set up MSVC
        # Supplies the Windows SDK, the linker and the MSVC ABI headers. It does NOT decide the
        # compiler — see the clang step below.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate clang
        # GoSurvey is built with clang targeting the MSVC ABI, which is what a developer machine
        # uses (CMakePresets pins clang explicitly for ninja-debug, and ninja-release picks up
        # whatever is first on PATH — clang, locally). CI must build the SAME thing it ships.
        #
        # This is not a preference: the codebase does not currently compile with cl.exe. MSVC
        # rejects `goto finish_render` in ViewportRenderer.cpp for jumping over ~50 variable
        # initializations (C2362) — which is correct, and clang is the lenient one. Porting the
        # renderer to be MSVC-clean is real work with real risk in a hot path, and it is not
        # this pipeline's job. Recorded as debt in TASK-049.
        id: clang
        shell: pwsh
        run: |
          $clangPath = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clangPath) {
            $candidate = 'C:\Program Files\LLVM\bin\clang.exe'
            if (-not (Test-Path $candidate)) {
              Write-Host "LLVM not present on the runner image - installing."
              choco install llvm -y --no-progress
            }
            if (-not (Test-Path $candidate)) { throw "clang.exe not found after install attempt" }
            $clangPath = $candidate
          }
          $bin = Split-Path $clangPath -Parent
          Write-Host "Using clang from $bin"
          "cc=$bin\clang.exe"   | Out-File $env:GITHUB_OUTPUT -Append
          "cxx=$bin\clang++.exe" | Out-File $env:GITHUB_OUTPUT -Append
          & "$bin\clang.exe" --version

      - name: Install Ninja
        # The repo's CMakePresets.json uses the Ninja generator. Installing it rather than
        # adding a CI-only Visual Studio preset keeps the CI build and the developer build
        # the same build — a second generator is a second set of behaviours to debug.
        run: choco install ninja -y --no-progress

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_CACHE_PATH }}
          # CMakeLists.txt holds every pinned dependency ref (glfw 3.4, the imgui SHA, glew
          # 2.2.0, the pdfium URL, Catch2 v3.5.2), so its hash is exactly the right key: it
          # changes when and only when a dependency does.
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # Version and channel
      # ---------------------------------------------------------------------
      - name: Resolve version and channel
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path CMakeLists.txt -Pattern 'project\(GoSurvey VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $line) { throw "Could not read project(VERSION) from CMakeLists.txt" }
          $version = $line.Matches[0].Groups[1].Value

          $branch = "${{ github.ref_name }}"
          if ($branch -eq 'master') {
            $channel  = 'stable'
            $full     = $version
            $suffix   = ''
            $quadLast = '0'
            $tag      = "v$version"
          } elseif ($branch -eq 'beta') {
            $channel  = 'beta'
            # The run number is monotonic per workflow, so betas order correctly within a
            # cycle: 0.5.0-beta.2 < 0.5.0-beta.10 (numeric compare, not string).
            $suffix   = "-beta.${{ github.run_number }}"
            $full     = "$version$suffix"
            $quadLast = "${{ github.run_number }}"
            $tag      = 'channel-beta'
          } else {
            $channel  = 'none'
            $suffix   = "-dev.${{ github.run_number }}"
            $full     = "$version$suffix"
            $quadLast = "${{ github.run_number }}"
            $tag      = ''
          }

          "version=$version"   | Out-File $env:GITHUB_OUTPUT -Append
          "full=$full"         | Out-File $env:GITHUB_OUTPUT -Append
          "suffix=$suffix"     | Out-File $env:GITHUB_OUTPUT -Append
          "quad=$version.$quadLast" | Out-File $env:GITHUB_OUTPUT -Append
          "channel=$channel"   | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag"           | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version=$version full=$full channel=$channel tag=$tag"

      - name: Check whether this version was already released
        id: gate
        if: github.ref_name == 'master'
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          # Ask the remote, not the local clone: a tag could have been pushed by another run.
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ([string]::IsNullOrWhiteSpace($existing)) {
            "publish=true" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "$tag does not exist - this push publishes a release."
          } else {
            "publish=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "$tag already exists - nothing to publish. Bump project(VERSION) to release."
          }

      # ---------------------------------------------------------------------
      # Build and test
      # ---------------------------------------------------------------------
      - name: Configure
        run: >
          cmake --preset ninja-release
          -DCMAKE_C_COMPILER="${{ steps.clang.outputs.cc }}"
          -DCMAKE_CXX_COMPILER="${{ steps.clang.outputs.cxx }}"
          -DGOSURVEY_VERSION_SUFFIX="${{ steps.ver.outputs.suffix }}"
          -DGOSURVEY_VERSION_BUILD=${{ github.run_number }}

      - name: Build
        run: cmake --build build

      - name: Test
        # Gates publication: a failing suite fails the job before any release step runs.
        run: ctest --test-dir build --output-on-failure

      # ---------------------------------------------------------------------
      # Package
      # ---------------------------------------------------------------------
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not present on the runner image - installing."
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install attempt" }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName `
            "/DAppVersion=${{ steps.ver.outputs.full }}" `
            "/DAppVersionQuad=${{ steps.ver.outputs.quad }}" `
            installer\GoSurvey.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Sign the installer
        # PLACEHOLDER — deliberately a no-op (ADR-029, decision-log D5). The installer ships
        # unsigned for now, so SmartScreen will warn and the manifest's SHA-256 proves integrity
        # but not authenticity. The step exists so signing drops in without restructuring the
        # pipeline. Since the 2023 CA/Browser hardware-key rules this needs a cloud signing
        # service (Azure Trusted Signing / SSL.com eSigner / DigiCert KeyLocker), NOT a .pfx in
        # a repository secret.
        shell: pwsh
        run: Write-Host "Code signing not configured - shipping unsigned (recorded technical debt)."

      - name: Write the update manifest
        id: manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer produced in installer\Output" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $tag = "${{ steps.ver.outputs.tag }}"
          $repo = "${{ github.repository }}"

          # The URL is built from the tag the asset will be published under, so the manifest is
          # correct at the moment it is written rather than depending on a later redirect.
          $url = "https://github.com/$repo/releases/download/$tag/$($installer.Name)"

          $manifest = [ordered]@{
            version     = "${{ steps.ver.outputs.full }}"
            channel     = "${{ steps.ver.outputs.channel }}"
            installerUrl= $url
            sha256      = $sha
            size        = $installer.Length
            releasedAt  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            # Reserved so that making an update mandatory later is a policy change, not a
            # protocol change: old clients already parse and ignore this field.
            mandatory   = $false
            notes       = "${{ github.event.head_commit.message }}"
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 installer\Output\latest.json
          "installer=$($installer.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          "name=$($installer.Name)"          | Out-File $env:GITHUB_OUTPUT -Append
          Get-Content installer\Output\latest.json

      # ---------------------------------------------------------------------
      # Publish
      # ---------------------------------------------------------------------
      - name: Upload artifact (non-release branches)
        if: github.ref_name != 'master' && github.ref_name != 'beta'
        uses: actions/upload-artifact@v4
        with:
          name: GoSurvey-${{ steps.ver.outputs.full }}
          path: |
            installer/Output/*.exe
            installer/Output/latest.json
          retention-days: 14

      - name: Publish the rolling beta prerelease
        if: github.ref_name == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One permanent prerelease row, not one per push. `--clobber` replaces the assets in
          # place, which is what gives the beta manifest a fixed, forever-valid URL.
          $exists = gh release view channel-beta 2>$null
          if (-not $exists) {
            gh release create channel-beta --prerelease --title "GoSurvey beta (rolling)" `
              --notes "Latest beta build. Assets here are replaced on every push to the beta branch."
          }
          gh release upload channel-beta `
            "installer\Output\${{ steps.manifest.outputs.name }}" `
            "installer\Output\latest.json" --clobber
          gh release edit channel-beta --title "GoSurvey ${{ steps.ver.outputs.full }} (beta)"

      - name: Publish the stable release
        if: github.ref_name == 'master' && steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `v` prefix, normalising the inconsistency in the existing tags (v0.1 ... v0.3.0, then
          # a bare 0.4.0). The old tag is left alone rather than rewriting published history.
          gh release create "v${{ steps.ver.outputs.version }}" `
            "installer\Output\${{ steps.manifest.outputs.name }}" `
            "installer\Output\latest.json" `
            --title "GoSurvey ${{ steps.ver.outputs.version }}" `
            --generate-notes

      - name: Report that the version gate held
        if: github.ref_name == 'master' && steps.gate.outputs.publish == 'false'
        run: echo "v${{ steps.ver.outputs.version }} is already released. Bump project(VERSION) in CMakeLists.txt to ship a new one."
