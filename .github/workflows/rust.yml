name: Rust

on:
  pull_request:
    branches: [feat/rust-port]

permissions:
  contents: read

jobs:
  format-linux:
    name: Format (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  build-test-linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (includes the layer rule check)
        run: cargo build --workspace --locked
      - name: cargo test
        run: cargo test --workspace --locked

  clippy-linux:
    name: Clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Compile-only check for Windows, run on Ubuntu. It does not link or run Windows binaries.
  check-windows-cross:
    name: Check and clippy for Windows (cross-compile, Linux runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (Windows MSVC target)
        run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
      - name: cargo clippy (Windows MSVC target, warnings are errors)
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

  # Critical Windows checks only: a native build and test run.
  build-test-windows:
    name: Build and test (Windows, native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --locked
      - name: cargo test
        run: cargo test --workspace --locked
