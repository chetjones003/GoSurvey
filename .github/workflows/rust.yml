name: Rust

on:
  pull_request:
    branches: [feat/rust-port]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build for Linux (includes the layer rule check)
        run: cargo build --workspace --locked

      - name: Clippy for Linux
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test for Linux
        run: cargo test --workspace --locked

      # Compile-only check for Windows. It does not link or run Windows binaries.
      - name: Check for Windows (MSVC target)
        run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc

      - name: Clippy for Windows (MSVC target)
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

  # Critical Windows checks only: a native build and test run. Routine checks
  # (formatting, clippy, cross-compile) run on the Ubuntu job above.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build for Windows
        run: cargo build --workspace --locked

      - name: Test for Windows
        run: cargo test --workspace --locked
