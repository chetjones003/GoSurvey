name: architecture-build-times

on:
  push:
    branches: [beta]

permissions:
  contents: write

# This is intentionally independent of architecture-metrics and required beta checks. If the
# dedicated runner is offline, this workflow queues separately and cannot hold up a beta push.
concurrency:
  group: architecture-build-times
  cancel-in-progress: false

jobs:
  measure:
    name: beta build-time sample
    runs-on: [self-hosted, Windows, X64, gosurvey-victus-ci]
    timeout-minutes: 120
    continue-on-error: true
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
    steps:
      - name: Check out beta commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Measure clean Release build and domain-header rebuild
        id: measure
        run: |
          $clean = [Diagnostics.Stopwatch]::StartNew()
          ./build.bat release --clean-first
          if ($LASTEXITCODE -ne 0) { throw "Clean Release build failed ($LASTEXITCODE)." }
          $clean.Stop()

          $header = Resolve-Path 'src/survey/SurveyPoints.hpp'
          (Get-Item -LiteralPath $header).LastWriteTimeUtc = [DateTime]::UtcNow.AddSeconds(2)
          $incremental = [Diagnostics.Stopwatch]::StartNew()
          ./build.bat release
          if ($LASTEXITCODE -ne 0) { throw "Domain-header rebuild failed ($LASTEXITCODE)." }
          $incremental.Stop()

          $record = @{
            commit = $env:GITHUB_SHA
            clean_release_seconds = [Math]::Round($clean.Elapsed.TotalSeconds, 2)
            domain_header_rebuild_seconds = [Math]::Round($incremental.Elapsed.TotalSeconds, 2)
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force -Path build/artifacts | Out-Null
          Set-Content -LiteralPath build/artifacts/build-times.json -Value $record -Encoding utf8

      - name: Publish sample to metrics history
        if: steps.measure.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $remote = "https://github.com/$env:REPOSITORY.git"
          $published = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $history = Join-Path $env:RUNNER_TEMP "architecture-build-times-$attempt"
            if (Test-Path $history) { Remove-Item -LiteralPath $history -Recurse -Force }
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" `
              clone --quiet --branch metrics $remote $history
            if ($LASTEXITCODE -ne 0) {
              if (Test-Path $history) { Remove-Item -LiteralPath $history -Recurse -Force }
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" `
                clone --quiet --no-checkout $remote $history
              if ($LASTEXITCODE -ne 0) { throw 'Could not fetch metrics history.' }
              git -C $history checkout --quiet --orphan metrics
            }
            $dir = Join-Path $history 'build-times'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $target = Join-Path $dir "$env:GITHUB_SHA.json"
            if (Test-Path $target) { throw "Build-time sample already exists for $env:GITHUB_SHA." }
            Copy-Item -LiteralPath build/artifacts/build-times.json -Destination $target
            git -C $history add -- build-times
            git -C $history commit --quiet -m "metrics: beta build times ($env:GITHUB_SHA)"
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit build-time sample.' }
            git -C $history -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" `
              push --quiet origin HEAD:refs/heads/metrics
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
          }
          if (-not $published) { throw 'Could not publish build-time sample after five attempts.' }
