# Full validation (REQ-437). Jobs live in a separate workflow for visibility and concurrency;
# master and beta branch protection require every full-validation status, so these checks block
# merge. A validated `docs-only` PR skips the work; approval remains governed by branch rules.
#
# Deliberately split into separate, independently-named jobs rather than one monolithic job: the
# PR checks list in GitHub's UI shows one line per job, so a failure is attributable at a glance
# (`full / clang-tidy` failed) instead of digging through one big log. Branch protection requires
# every status here. Nothing in this workflow publishes
# anything — that stays in release.yml (REQ-202/ADR-029), which is manual-dispatch only.
#
# MSVC analysis remains a blocking diff-scoped check with a fail-closed full-project fallback.
# release.yml remains a separate, manual-dispatch publication pipeline (REQ-202). It uses the
# same hosted Mesa/OpenGL test prerequisites so release CTest exercises the validated app path.

name: full-validation

on:
  pull_request:
    branches: [master, beta]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Benchmark runs: `gh workflow run full-validation.yml --ref <branch> -f cache=cold|warm`.
  # cold uses a per-run cache namespace, so no archive can be restored.
  workflow_dispatch:
    inputs:
      cache:
        description: cold = no sccache archive restored; warm = restore the branch or base archive
        type: choice
        options: [warm, cold]
        default: warm

concurrency:
  group: full-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  NINJA_STATUS: '[%f/%t; %r running; %e s] '

jobs:
  # ---------------------------------------------------------------------------
  # docs-only classification — fail closed: an API/classification error leaves the output empty,
  # causing every validation job below to run. Shared with CodeQL via a repository script. Only
  # the `docs-only` label plus documentation-only paths can skip CI.
  # ---------------------------------------------------------------------------
  classify-docs-only:
    name: full / docs-only policy
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      has_cpp_changes: ${{ steps.changed-cpp.outputs.has_cpp_changes }}
    steps:
      - name: Check out classifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate docs-only label against changed paths
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/classify_docs_only.py

      - name: Detect changed C/C++ files
        id: changed-cpp
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python - <<'PY'
          import os
          import subprocess

          files = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).splitlines()
          suffixes = (".c", ".cc", ".cpp", ".cxx", ".c++", ".h", ".hh", ".hpp", ".hxx", ".inl", ".ipp", ".tpp", ".inc")
          changed = any(
              path.lower().endswith(suffixes) and not path.lower().startswith("third_party/")
              for path in files
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_cpp_changes={str(changed).lower()}\n")
          print(f"Changed C/C++ files present: {changed}")
          PY

  # ---------------------------------------------------------------------------
  # Run every registered test on independent standard Windows runners. The aggregate job below
  # keeps the historical required-check name and validates exact Catch2/Qt case coverage.
  # ---------------------------------------------------------------------------
  test-shards:
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    name: full / test shards (${{ matrix.name }})
    # Build once: shards start after the build job has saved the sccache archive, so each shard
    # restores the just-built objects instead of recompiling them. Graph: build, then tests.
    needs: [classify-docs-only, build-all-targets]
    if: >-
      always() &&
      needs.build-all-targets.result == 'success' &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: ${{ vars.GOSURVEY_FULL_VALIDATION_RUNNER || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qt-00
            regex: '^qt[.]editor[.]shard-0$'
            targets: GoSurveyQtTests
          - name: qt-01
            regex: '^qt[.]editor[.]shard-1$'
            targets: GoSurveyQtTests
          - name: qt-02
            regex: '^qt[.]editor[.]shard-2$'
            targets: GoSurveyQtTests
          - name: qt-03
            regex: '^qt[.]editor[.]shard-3$'
            targets: GoSurveyQtTests
          - name: qt-04
            regex: '^qt[.]editor[.]shard-4$'
            targets: GoSurveyQtTests
          - name: qt-05
            regex: '^qt[.]editor[.]shard-5$'
            targets: GoSurveyQtTests
          - name: qt-06
            regex: '^qt[.]editor[.]shard-6$'
            targets: GoSurveyQtTests
          - name: qt-07
            regex: '^qt[.]editor[.]shard-7$'
            targets: GoSurveyQtTests
          - name: qt-08
            regex: '^qt[.]editor[.]shard-8$'
            targets: GoSurveyQtTests
          - name: qt-09
            regex: '^qt[.]editor[.]shard-9$'
            targets: GoSurveyQtTests
          - name: qt-10
            regex: '^qt[.]editor[.]shard-10$'
            targets: GoSurveyQtTests
          - name: qt-11
            regex: '^qt[.]editor[.]shard-11$'
            targets: GoSurveyQtTests
          - name: catch-00
            regex: '^unit[.]catch[.]shard-0$'
            targets: GoSurveyTests
          - name: catch-01
            regex: '^unit[.]catch[.]shard-1$'
            targets: GoSurveyTests
          - name: catch-02
            regex: '^unit[.]catch[.]shard-2$'
            targets: GoSurveyTests
          - name: catch-03
            regex: '^unit[.]catch[.]shard-3$'
            targets: GoSurveyTests
          - name: integration
            regex: ''
            exclude: '^(qt[.]editor[.]shard-|unit[.]catch[.]shard-)'
            targets: GoSurveyQtTests,gosurvey_headless
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test installer manifest parsing
        if: matrix.name == 'integration'
        run: ./tests/powershell/install-manifest-parser.tests.ps1

      - name: Release build and test validation
        uses: ./.github/actions/release-validation
        with:
          version-suffix: ''
          version-build: '0'
          beta-version: ''
          # Every matrix member is a separate hosted runner and executes one named CTest group.
          test-parallel: '1'
          qt-test-shards: '12'
          catch-test-shards: '4'
          ctest-regex: ${{ matrix.regex }}
          ctest-exclude: ${{ matrix.exclude || '' }}
          build-targets: ${{ matrix.targets }}
          cache-namespace: ${{ github.event_name == 'workflow_dispatch' && inputs.cache == 'cold' && format('cold-{0}', github.run_id) || 'sccache-msvc-release' }}
          prepare-qt-tests: ${{ !startsWith(matrix.name, 'catch-') }}

      - name: Summarize CI performance
        if: always()
        run: python .github/scripts/report_ci_performance.py --build-dir build/.cmake/release --output-dir build/artifacts/ci --sccache

      - name: Upload CI performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-test-${{ matrix.name }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            build/artifacts/ci/
            build/artifacts/catch/
            build/artifacts/coverage-*.json
            build/artifacts/qt-editor/**/discovery.json
            build/.cmake/release/.ninja_log
            build/.cmake/release/Testing/Temporary/LastTest.log
            build/.cmake/release/Testing/Temporary/LastTestsFailed.log
            build/artifacts/qt-editor/**/qt-tests.xml
            build/artifacts/qt-editor/**/qt-tests.log

      - name: Upload test coverage manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-${{ matrix.name }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            build/artifacts/catch/
            build/artifacts/qt-editor/

  # Keep the complete target build blocking, but perform it once in parallel with the test workers.
  build-all-targets:
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    name: full / build all targets
    needs: classify-docs-only
    if: >-
      always() &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: ${{ vars.GOSURVEY_FULL_VALIDATION_RUNNER || 'windows-latest' }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build every Release target
        uses: ./.github/actions/release-validation
        with:
          version-suffix: ''
          version-build: '0'
          beta-version: ''
          test-parallel: '1'
          qt-test-shards: '12'
          catch-test-shards: '4'
          build-targets: all
          cache-namespace: ${{ github.event_name == 'workflow_dispatch' && inputs.cache == 'cold' && format('cold-{0}', github.run_id) || 'sccache-msvc-release' }}
          run-tests: 'false'

      - name: Summarize CI performance
        if: always()
        run: python .github/scripts/report_ci_performance.py --build-dir build/.cmake/release --output-dir build/artifacts/ci --sccache

      - name: Upload build performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-build-all-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            build/artifacts/ci/
            build/.cmake/release/.ninja_log

  # Retain the branch-protection context while making every individual test/build failure blocking.
  build-and-test:
    name: full / build and test
    needs: [classify-docs-only, test-shards, build-all-targets]
    if: >-
      always() &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out coverage verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm every build and test shard passed
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
          BUILD_RESULT: ${{ needs.build-all-targets.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ]; then
            echo "Build result: $BUILD_RESULT; test matrix result: $SHARD_RESULT" >&2
            exit 1
          fi

      - name: Download all Catch2 and Qt coverage evidence
        uses: actions/download-artifact@v4
        with:
          pattern: test-coverage-*-${{ github.run_attempt }}
          merge-multiple: true
          path: build/artifacts

      - name: Verify every discovered test ran exactly once
        env:
          TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python tools/verify-test-coverage.py --artifacts build/artifacts --run-id "$TEST_RUN_ID"

  # ---------------------------------------------------------------------------
  # lint / clang-tidy — scoped to LINES the PR actually changed (via clang-tidy's own
  # -line-filter), not whole files. (Amended 2026-10-11, issue #824 follow-up: the original
  # whole-file scoping still left a PR on the hook for every pre-existing warning anywhere in
  # any file it touched — on a file the size of CadCommands.hpp that is tens of thousands of
  # unrelated, untriaged warnings, which made the check unpassable for any PR touching that file
  # regardless of what the PR itself changed. PR #829 hit this: 0 findings on its own diff, ~95
  # pre-existing ones elsewhere in the same files.) HeaderFilterRegex below means a .cpp's
  # included headers are analyzed too, so the SAME combined line-filter (one {name, lines} entry
  # per changed file) is reused for every clang-tidy invocation in this job, not just the one
  # where that header is the direct target — otherwise a header's own genuinely-new lines would
  # only be checked when it happens to be the file passed on the command line.
  #
  # Runs natively on a Windows worker rather than via a container action (e.g.
  # ZedThree/clang-tidy-review): GitHub Actions container actions require a Linux runner,
  # and compile_commands.json here only resolves against the MSVC toolchain (Windows-only),
  # so a container-based reviewer can't see real compile flags anyway. windows-latest ships
  # LLVM's clang-tidy.exe (C:\Program Files\LLVM\bin), which is used directly against the
  # MSVC-generated compile database instead.
  # ---------------------------------------------------------------------------
  lint-clang-tidy:
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    name: full / clang-tidy
    needs: classify-docs-only
    if: >-
      always() &&
      (needs.classify-docs-only.result != 'success' ||
       (needs.classify-docs-only.outputs.docs_only != 'true' &&
        needs.classify-docs-only.outputs.has_cpp_changes != 'false'))
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Ensure Ninja
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) { exit 0 }
          $ver = '1.12.1'
          $dir = Join-Path $env:RUNNER_TEMP 'ninja'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'ninja.zip'
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$ver/ninja-win.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Record runner capacity and Ninja defaults
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./.github/scripts/record_ci_runner.ps1

      - name: Configure (compile_commands.json only, no build)
        # GOSURVEY_USE_PCH=OFF: this step deliberately never builds, so no cmake_pch.cxx.pch
        # is ever produced. Leaving PCH on left compile_commands.json referencing a .pch that
        # does not exist, failing clang-tidy on ANY PCH-covered file with a PCH-not-found
        # compiler error (unrelated to the file's own content) rather than a real finding.
        run: cmake --preset ninja-release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGOSURVEY_USE_PCH=OFF -DGOSURVEY_BUILD_QT=ON

      - name: clang-tidy (lines changed in this PR only)
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$env:BASE_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the PR base." }
          ./tools/run-clang-tidy-diff.ps1 -BaseSha $env:BASE_SHA

      - name: Summarize CI performance
        if: always()
        run: python .github/scripts/report_ci_performance.py --build-dir build/.cmake/release --output-dir build/artifacts/ci

      - name: Upload CI performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            build/artifacts/ci/
            build/.cmake/release/.ninja_log
            build/.cmake/release/Testing/Temporary/LastTest.log
            build/.cmake/release/Testing/Temporary/LastTestsFailed.log
            build/artifacts/qt-editor/**/qt-tests.xml
            build/artifacts/qt-editor/**/qt-tests.log

  # ---------------------------------------------------------------------------
  # lint / msvc-analyze — blocking (see header comment). Analyze changed translation units and
  # consumers of changed headers; if dependency classification is uncertain, analyze all units.
  # Findings surface as build annotations via the existing problem matcher and fail through /WX.
  # ---------------------------------------------------------------------------
  lint-msvc-analyze:
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    name: full / msvc-analyze
    needs: classify-docs-only
    if: >-
      always() &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Ensure Ninja
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) { exit 0 }
          $ver = '1.12.1'
          $dir = Join-Path $env:RUNNER_TEMP 'ninja'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'ninja.zip'
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$ver/ninja-win.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Record runner capacity and Ninja defaults
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./.github/scripts/record_ci_runner.ps1

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: >
          cmake --preset ninja-release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DGOSURVEY_ENABLE_ANALYZE=ON
          -DGOSURVEY_ANALYZE_WERROR=ON
          -DGOSURVEY_USE_PCH=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Verify sccache is in the compile commands
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $commands = & ninja -C build/.cmake/release -t commands
          if ($LASTEXITCODE -ne 0) { throw "Ninja could not list compile commands (exit $LASTEXITCODE)" }
          if (-not ($commands | Select-String -Pattern 'sccache(\.exe)?' -Quiet)) {
            throw 'CMake generated compile commands without sccache; the MSVC cache would otherwise remain unused.'
          }

      - name: Register MSVC /analyze problem matcher
        run: echo "::add-matcher::.github/msvc-analyze-matcher.json"

      - name: Select changed translation units
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$env:BASE_SHA"
          python .github/scripts/select_msvc_analyze_targets.py `
            --base-sha "$env:BASE_SHA" `
            --compile-commands build/.cmake/release/compile_commands.json `
            --build-dir build/.cmake/release `
            --targets-file build/.cmake/release/msvc-analyze-selection.json

      - name: Run MSVC /analyze for affected translation units
        run: >
          python .github/scripts/run_msvc_analyze.py
          --selection build/.cmake/release/msvc-analyze-selection.json
          --build-dir build/.cmake/release
          --compiler-launcher sccache
          --jobs 4

      - name: Summarize CI performance
        if: always()
        run: python .github/scripts/report_ci_performance.py --build-dir build/.cmake/release --output-dir build/artifacts/ci --sccache

      - name: Upload CI performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          path: |
            build/artifacts/ci/
            build/.cmake/release/.ninja_log
            build/.cmake/release/Testing/Temporary/LastTest.log
            build/.cmake/release/Testing/Temporary/LastTestsFailed.log
            build/artifacts/qt-editor/**/qt-tests.xml
            build/artifacts/qt-editor/**/qt-tests.log
