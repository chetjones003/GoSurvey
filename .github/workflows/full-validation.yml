# Required PR build (REQ-437). Publication stays in the manual release workflow.

name: full-validation

on:
  pull_request:
    branches: [master, beta]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: full-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  NINJA_STATUS: '[%f/%t; %r running; %e s] '

jobs:
  build-all-targets:
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    name: full / build all targets
    # Fork PRs wait for maintainer approval before using the self-hosted PR pool.
    runs-on: [self-hosted, Windows, X64, gosurvey-pr-build]
    env:
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build every Release target
        uses: ./.github/actions/release-validation
        with:
          version-suffix: ''
          version-build: '0'
          beta-version: ''
          build-targets: all
          run-tests: 'false'

      - name: Summarize CI performance
        if: ${{ !cancelled() }}
        run: python .github/scripts/report_ci_performance.py --build-dir build/.cmake/release --output-dir build/artifacts/ci --sccache

      - name: Store build performance evidence on the runner
        if: ${{ !cancelled() }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'ci-evidence-build-all'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          if (Test-Path build/artifacts/ci) { Copy-Item -Recurse -Force build/artifacts/ci (Join-Path $evidence 'ci') }
          if (Test-Path build/.cmake/release/.ninja_log) { Copy-Item -Force build/.cmake/release/.ninja_log $evidence }
          $storage = Join-Path (Split-Path -Parent $env:RUNNER_TEMP) 'ci-artifacts'
          ./tools/ci-local-artifacts.ps1 -Action store -Name "ci-evidence-build-all" -SourcePath $evidence -StorageRoot $storage

      - name: Stop the build's compiler cache
        if: always() && env.GOSURVEY_CI_CACHE_STARTED == 'true'
        run: ./tools/ci-compiler-cache.ps1 -Action stop
