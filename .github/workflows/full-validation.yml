# Full validation (REQ-437). Jobs live in a separate workflow for visibility and concurrency;
# master and beta branch protection require the build status, so this check blocks
# merge. A validated `docs-only` PR skips the work; approval remains governed by branch rules.
#
# Nothing in this workflow publishes
# anything — that stays in release.yml (REQ-202/ADR-029), which is manual-dispatch only.
#
# release.yml remains a separate, manual-dispatch publication pipeline (REQ-202). It uses the
# release validation keeps its own test prerequisites and CTest coverage.

name: full-validation

on:
  pull_request:
    branches: [master, beta]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

concurrency:
  group: full-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  NINJA_STATUS: '[%f/%t; %r running; %e s] '

jobs:
  # ---------------------------------------------------------------------------
  # docs-only classification — fail closed: an API/classification error leaves the output empty,
  # causing every validation job below to run. Shared with CodeQL via a repository script. Only
  # the `docs-only` label plus documentation-only paths can skip CI.
  # ---------------------------------------------------------------------------
  classify-docs-only:
    name: full / docs-only policy
    runs-on: [self-hosted, Windows, X64]
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      has_cpp_changes: ${{ steps.changed-cpp.outputs.has_cpp_changes }}
    steps:
      - name: Check out classifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate docs-only label against changed paths
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/classify_docs_only.py

      - name: Detect changed C/C++ files
        id: changed-cpp
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$env:BASE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the PR base.' }
          @'
          import os
          import subprocess

          files = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).splitlines()
          suffixes = (".c", ".cc", ".cpp", ".cxx", ".c++", ".h", ".hh", ".hpp", ".hxx", ".inl", ".ipp", ".tpp", ".inc")
          changed = any(
              path.lower().endswith(suffixes) and not path.lower().startswith("third_party/")
              for path in files
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_cpp_changes={str(changed).lower()}\n")
          print(f"Changed C/C++ files present: {changed}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'C/C++ change detection failed.' }

  # Keep the complete target build blocking while other checks are paused.
  build-all-targets:
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    name: full / build all targets
    needs: classify-docs-only
    if: >-
      always() &&
      (needs.classify-docs-only.result != 'success' ||
       needs.classify-docs-only.outputs.docs_only != 'true')
    # Self-hosted Victus build runner; fork PRs wait for maintainer approval before running here.
    runs-on: [self-hosted, Windows, X64, gosurvey-victus-ci]
    env:
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build every Release target
        uses: ./.github/actions/release-validation
        with:
          version-suffix: ''
          version-build: '0'
          beta-version: ''
          build-targets: all
          run-tests: 'false'

      - name: Summarize CI performance
        if: always()
        run: python .github/scripts/report_ci_performance.py --build-dir build/.cmake/release --output-dir build/artifacts/ci --sccache

      - name: Store build performance evidence on the runner
        if: always()
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'ci-evidence-build-all'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          if (Test-Path build/artifacts/ci) { Copy-Item -Recurse -Force build/artifacts/ci (Join-Path $evidence 'ci') }
          if (Test-Path build/.cmake/release/.ninja_log) { Copy-Item -Force build/.cmake/release/.ninja_log $evidence }
          ./tools/ci-local-artifacts.ps1 -Action store -Name "ci-evidence-build-all" -SourcePath $evidence
