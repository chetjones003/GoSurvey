name: Release build and test
description: Configure, build, and run the full Release CTest suite with the release test runtime.
inputs:
  version-suffix:
    description: Optional product version suffix supplied by the caller.
    required: false
    default: ''
  version-build:
    description: Product build number supplied by the caller.
    required: false
    default: '0'
  beta-version:
    description: Optional rolling beta version supplied by the release caller.
    required: false
    default: ''
  build-channel:
    description: Crash-report channel compiled into the build (stable, beta, or dev). Non-release builds use dev (D-2026-11-09-d).
    required: false
    default: 'dev'
  test-parallel:
    description: Number of CTest processes; auto uses runner capacity.
    required: false
    default: 'auto'
  qt-test-shards:
    description: Number of isolated Qt test processes configured in CTest.
    required: false
    default: 'auto'
  catch-test-shards:
    description: Number of isolated Catch2 test processes configured in CTest.
    required: false
    default: '2'
  ctest-regex:
    description: Optional CTest test-name regex to run.
    required: false
    default: ''
  ctest-exclude:
    description: Optional CTest test-name regex to exclude.
    required: false
    default: ''
  build-targets:
    description: Comma-separated CMake targets to build, or all.
    required: false
    default: 'all'
  run-tests:
    description: Whether to stage test runtimes and run CTest.
    required: false
    default: 'true'
  prepare-qt-tests:
    description: Whether to stage Mesa and prepare the hidden Qt display.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Qt
      uses: ./.github/actions/setup-qt

    - name: Set up Mesa OpenGL for hosted tests
      if: inputs.run-tests == 'true' && inputs.prepare-qt-tests == 'true'
      shell: pwsh
      run: |
        $version = '26.2.4'
        $archive = Join-Path $env:RUNNER_TEMP "mesa3d-$version-release-msvc.7z"
        $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
        Invoke-WebRequest -Uri $url -OutFile $archive
        $expectedHash = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
        $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash) { throw "Mesa archive SHA256 mismatch: $actualHash" }

        $sevenZipPath = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
        if (-not $sevenZipPath) { $sevenZipPath = 'C:\Program Files\7-Zip\7z.exe' }
        if (-not (Test-Path -LiteralPath $sevenZipPath)) { throw '7-Zip was not found on this Windows runner' }
        $extractDir = Join-Path $env:RUNNER_TEMP "mesa3d-$version"
        New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
        & $sevenZipPath x $archive "-o$extractDir" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7-Zip failed to extract Mesa (exit $LASTEXITCODE)" }

        $mesaOpenGl = Get-ChildItem -LiteralPath $extractDir -Recurse -File -Filter opengl32.dll |
          Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
        if (-not $mesaOpenGl) { throw 'Mesa x64 opengl32.dll was not present in the pinned archive' }
        "GOSURVEY_MESA_BIN=$($mesaOpenGl.DirectoryName)" | Add-Content $env:GITHUB_ENV
        'GALLIUM_DRIVER=llvmpipe' | Add-Content $env:GITHUB_ENV

    - name: Ensure Ninja
      shell: pwsh
      run: |
        if (Get-Command ninja -ErrorAction SilentlyContinue) { exit 0 }
        $version = '1.12.1'
        $directory = Join-Path $env:RUNNER_TEMP 'ninja'
        New-Item -ItemType Directory -Force -Path $directory | Out-Null
        $archive = Join-Path $env:RUNNER_TEMP 'ninja.zip'
        Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$version/ninja-win.zip" -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $directory -Force
        Add-Content -Path $env:GITHUB_PATH -Value $directory

    - name: Record runner capacity and Ninja defaults
      shell: pwsh
      run: ./.github/scripts/record_ci_runner.ps1

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Register MSVC /analyze problem matcher
      shell: pwsh
      run: echo "::add-matcher::.github/msvc-analyze-matcher.json"

    - name: Configure Release build
      shell: pwsh
      env:
        VERSION_SUFFIX: ${{ inputs.version-suffix }}
        VERSION_BUILD: ${{ inputs.version-build }}
        BETA_VERSION: ${{ inputs.beta-version }}
        BUILD_CHANNEL: ${{ inputs.build-channel }}
      run: |
        $logicalProcessors = [Environment]::ProcessorCount
        $qtShards = [Math]::Min(16, [Math]::Max(6, [int][Math]::Ceiling($logicalProcessors * 1.5)))
        $requestedQtShards = '${{ inputs.qt-test-shards }}'
        if ($requestedQtShards -ne 'auto') {
          if ($requestedQtShards -notmatch '^[1-9][0-9]*$' -or [int]$requestedQtShards -gt 16) { throw 'qt-test-shards must be auto or an integer from 1 to 16.' }
          $qtShards = [int]$requestedQtShards
        }
        $requestedCatchShards = '${{ inputs.catch-test-shards }}'
        if ($requestedCatchShards -notmatch '^[1-9][0-9]*$' -or [int]$requestedCatchShards -gt 16) { throw 'catch-test-shards must be an integer from 1 to 16.' }
        if ('${{ inputs.run-tests }}' -notin @('true', 'false')) { throw 'run-tests must be true or false.' }
        if ('${{ inputs.prepare-qt-tests }}' -notin @('true', 'false')) { throw 'prepare-qt-tests must be true or false.' }
        $testParallel = [Math]::Min(16, [Math]::Max(8, $logicalProcessors))
        $requestedTestParallel = '${{ inputs.test-parallel }}'
        if ($requestedTestParallel -ne 'auto') {
          if ($requestedTestParallel -notmatch '^[1-9][0-9]*$') { throw 'test-parallel must be auto or a positive integer.' }
          $testParallel = [Math]::Min(16, [int]$requestedTestParallel)
        }
        "GOSURVEY_CTEST_PARALLEL=$testParallel" | Add-Content $env:GITHUB_ENV
        Write-Host "Runner processors: $logicalProcessors; Qt shards: $qtShards; CTest workers: $testParallel"
        cmake --preset ninja-release `
          -DCMAKE_C_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -DGOSURVEY_USE_PCH=OFF `
          "-DGOSURVEY_QT_TEST_SHARDS=$qtShards" `
          "-DGOSURVEY_CATCH_TEST_SHARDS=$requestedCatchShards" `
          "-DGOSURVEY_BUILD_CHANNEL=$env:BUILD_CHANNEL" `
          "-DGOSURVEY_BETA_VERSION=$env:BETA_VERSION" `
          "-DGOSURVEY_VERSION_SUFFIX=$env:VERSION_SUFFIX" `
          "-DGOSURVEY_VERSION_BUILD=$env:VERSION_BUILD"
        if ($LASTEXITCODE -ne 0) { throw 'Release configure failed.' }

    - name: Build Release targets
      shell: pwsh
      run: |
        $workers = [Math]::Min(16, [Environment]::ProcessorCount)
        $requestedTargets = '${{ inputs.build-targets }}'
        if ($requestedTargets -eq 'all') {
          cmake --build --preset ninja-release --parallel $workers
        } else {
          $targets = @($requestedTargets.Split(',') | ForEach-Object { $_.Trim() })
          $allowedTargets = @('GoSurveyQtTests', 'GoSurveyTests', 'gosurvey_headless')
          if ($targets.Count -eq 0 -or @($targets | Where-Object { $_ -notin $allowedTargets }).Count -gt 0) {
            throw 'build-targets must be all or a comma-separated list of GoSurveyQtTests, GoSurveyTests, and gosurvey_headless.'
          }
          cmake --build --preset ninja-release --parallel $workers --target $targets
        }
        if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

    - name: Stage Mesa runtime dependencies for tests
      if: inputs.run-tests == 'true' && inputs.prepare-qt-tests == 'true'
      shell: pwsh
      run: |
        $runtime = Join-Path $env:GITHUB_WORKSPACE 'build'
        $backup = Join-Path $env:RUNNER_TEMP 'gosurvey-release-qt-runtime-backup'
        New-Item -ItemType Directory -Force -Path $backup | Out-Null
        foreach ($dependency in 'opengl32.dll', 'libgallium_wgl.dll', 'libglapi.dll', 'dxil.dll') {
          $source = Join-Path $env:GOSURVEY_MESA_BIN $dependency
          $destination = Join-Path $runtime $dependency
          if (Test-Path -LiteralPath $destination) {
            Copy-Item -LiteralPath $destination -Destination (Join-Path $backup $dependency) -Force
          }
          if (Test-Path -LiteralPath $source) {
            Copy-Item -LiteralPath $source -Destination $destination -Force
          } elseif ($dependency -eq 'opengl32.dll') {
            throw "Pinned Mesa OpenGL entry point is missing: $source"
          }
        }

    - name: Prepare hosted display for Qt tests
      if: inputs.run-tests == 'true' && inputs.prepare-qt-tests == 'true'
      shell: pwsh
      run: ./tools/prepare-qt-test-display.ps1

    - name: Run selected Release CTest suite
      if: inputs.run-tests == 'true'
      shell: pwsh
      env:
        QT_OPENGL: desktop
        GALLIUM_DRIVER: llvmpipe
      run: |
        $env:GOSURVEY_TEST_RUN_ID = "ci-${{ github.run_id }}-${{ github.run_attempt }}"
        "GOSURVEY_TEST_RUN_ID=$env:GOSURVEY_TEST_RUN_ID" | Add-Content $env:GITHUB_ENV
        $testParallel = [Math]::Min(16, [Math]::Max(8, [Environment]::ProcessorCount))
        if ($env:GOSURVEY_CTEST_PARALLEL -match '^[1-9][0-9]*$') { $testParallel = [int]$env:GOSURVEY_CTEST_PARALLEL }
        $ciArtifacts = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts/ci'
        New-Item -ItemType Directory -Force -Path $ciArtifacts | Out-Null
        $junitPath = Join-Path $ciArtifacts 'ctest.xml'
        $ctestArgs = @('--preset', 'ninja-release', '--parallel', "$testParallel", '--output-on-failure', '--output-junit', $junitPath)
        $testRegex = '${{ inputs.ctest-regex }}'
        $excludeRegex = '${{ inputs.ctest-exclude }}'
        if ($testRegex) { $ctestArgs += @('-R', $testRegex) }
        if ($excludeRegex) { $ctestArgs += @('-E', $excludeRegex) }
        ctest @ctestArgs
        if ($LASTEXITCODE -ne 0) { throw 'CTest failed.' }

    - name: Restore Qt OpenGL runtime files
      if: always() && inputs.run-tests == 'true' && inputs.prepare-qt-tests == 'true'
      shell: pwsh
      run: |
        $runtime = Join-Path $env:GITHUB_WORKSPACE 'build'
        $backup = Join-Path $env:RUNNER_TEMP 'gosurvey-release-qt-runtime-backup'
        if (-not (Test-Path -LiteralPath $backup)) { exit 0 }
        foreach ($dependency in 'opengl32.dll', 'libgallium_wgl.dll', 'libglapi.dll', 'dxil.dll') {
          $saved = Join-Path $backup $dependency
          $staged = Join-Path $runtime $dependency
          if (Test-Path -LiteralPath $saved) {
            Copy-Item -LiteralPath $saved -Destination $staged -Force
          } elseif (Test-Path -LiteralPath $staged) {
            Remove-Item -LiteralPath $staged -Force
          }
        }
