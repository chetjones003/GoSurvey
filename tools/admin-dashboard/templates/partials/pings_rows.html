{{range .Rows}}
<tr>
  <td title="{{.TS}}">{{ago .TS}} <span class="muted mono">{{stamp .TS}}</span></td>
  <td><span class="badge {{.Event}}">{{.Event}}</span></td>
  <td class="mono">{{.Version}}</td>
  <td><span class="badge ch">{{.Channel}}</span></td>
  <td class="mono">{{.OS}}</td>
  <td>{{if .Country}}{{country .Country}}{{else}}<span class="muted">—</span>{{end}}</td>
  <td class="mono">{{if .Email}}{{.Email}}{{else}}<span class="muted">—</span>{{end}}</td>
  <td class="mono muted copy" title="Click to copy" data-copy="{{.InstallID}}">{{.InstallID}}</td>
</tr>
{{else}}
<tr><td colspan="8" class="empty">No pings match the filters.</td></tr>
{{end}}
{{template "pager_row" .Pager}}
