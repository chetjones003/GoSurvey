{{range .Rows}}
<tr>
  <td class="mono">{{.Email}}</td>
  <td><span class="badge tier-{{.Tier}}">{{.Tier}}</span></td>
  <td class="muted" title="{{.CreatedAt}}">{{date .CreatedAt}} · {{ago .CreatedAt}} <span class="muted mono">{{stamp .CreatedAt}}</span></td>
  <td class="mono muted copy" title="Click to copy" data-copy="{{.Auth0Sub}}">{{.Auth0Sub}}</td>
</tr>
{{else}}
<tr><td colspan="4" class="empty">No users match the filters.</td></tr>
{{end}}
{{template "pager_row" .Pager}}
