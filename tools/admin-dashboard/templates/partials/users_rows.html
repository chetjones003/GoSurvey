{{if not .Rows}}
<tr><td colspan="4" class="muted" style="padding:18px; text-align:center">No users match the filters.</td></tr>
{{else}}
{{range .Rows}}
<tr>
  <td class="mono muted" title="{{.Auth0Sub}}">{{slice .Auth0Sub 0 22}}…</td>
  <td class="mono">{{.Email}}</td>
  <td><span class="badge tier-{{.Tier}}">{{.Tier}}</span></td>
  <td class="mono muted">{{.CreatedAt}}</td>
</tr>
{{end}}
{{end}}
<tr>
  <td colspan="4" style="padding:10px 12px; border-top:1px solid #e5e7eb">
    <div class="pager">
      <span class="muted small">{{.Total}} rows · page {{.Page}} / {{.TotalPages}}</span>
      <span class="pager-btns">
        {{if .HasPrev}}
        <button class="btn btn-ghost small" hx-get="/partials/users?page={{.PrevPage}}&tier={{index .Query "tier"}}&q={{index .Query "q"}}" hx-target="#users-body">← Prev</button>
        {{else}}<button class="btn btn-ghost small" disabled>← Prev</button>{{end}}
        {{if .HasNext}}
        <button class="btn btn-ghost small" hx-get="/partials/users?page={{.NextPage}}&tier={{index .Query "tier"}}&q={{index .Query "q"}}" hx-target="#users-body">Next →</button>
        {{else}}<button class="btn btn-ghost small" disabled>Next →</button>{{end}}
      </span>
    </div>
  </td>
</tr>
