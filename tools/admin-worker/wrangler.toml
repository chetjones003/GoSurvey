name = "admin-api"
main = "src/index.js"

# Pin the runtime date, same reasoning as the other two Workers (see
# tools/telemetry-worker/wrangler.toml): behaviour shifts by compatibility date, not deploy date.
compatibility_date = "2026-10-01"

# Served at https://admin.gosurveycad.com/ once this route is added as a Custom Domain / Route on
# the Worker in the dashboard (Workers & Pages -> admin-api -> Settings -> Triggers -> Routes).
# REQ-402/ADR-068: this subdomain is deliberately unlinked from the public site and is the ONLY
# thing standing between a casual visitor and the dashboard's existence -- the actual access
# control is the Cloudflare Access policy on this route, not this Worker's code.
[[routes]]
pattern = "admin.gosurveycad.com/*"
zone_name = "gosurveycad.com"

# Read-only bindings into the two existing databases (ADR-068 (b)). This Worker never runs an
# INSERT/UPDATE/DELETE against either -- see src/index.js, every query is a SELECT.
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "gosurvey-telemetry"
database_id = "6a6a538a-a9e2-489f-81e8-3908741d0fc5"

[[d1_databases]]
binding = "ACCOUNTS_DB"
database_name = "gosurveycad-db"
database_id = "52901a18-3eb2-4ea4-909c-aa71201ac5e8"

# Deliberately absent: [observability] (Workers Logs). This Worker only reads D1 data that's
# already stripped of IPs (REQ-080); no reason to also start retaining request logs here. Turn on
# the Cloudflare dashboard's own Workers Logs view for live request/error diagnostics instead
# (REQ-402 clause 2d) -- that's exactly what this Worker links out to.
