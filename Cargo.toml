[workspace]
resolver = "3"
members = [
    "foundation",
    "kernel",
    "domain",
    "services",
    "application",
    "editor",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.cargo]
# Layer crates declare the layer below as a dependency before they use it.
# Remove this once each layer uses its dependency.
unused_dependencies = "allow"
